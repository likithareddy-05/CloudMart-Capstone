AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Security Stack.
  Creates IAM execution roles for CloudMart Lambda functions
  with least-privilege permissions for CloudWatch Logs,
  SSM Parameter Store, EventBridge, SNS and S3.


# =========================================================
# PARAMETERS
# =========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


# =========================================================
# CONDITIONS
# =========================================================

Conditions:

  IsProd:
    !Equals
      - !Ref Environment
      - prod


# =========================================================
# RESOURCES
# =========================================================

Resources:


  # =======================================================
  # 1. AUTHORIZER LAMBDA ROLE
  # =======================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-AuthorizerLambdaRole

      Description:
        IAM execution role for CloudMart Lambda Authorizer

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole


      Policies:

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # -------------------------------------------
              # Read authentication token from SSM
              # -------------------------------------------

              - Sid: ReadAuthToken

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/user-token

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/admin-token


  # =======================================================
  # 2. PRODUCT LAMBDA ROLE
  # =======================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-ProductLambdaRole

      Description:
        IAM execution role for CloudMart Product Lambda

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

        - PolicyName:
            !Sub CloudMart-${Environment}-ProductAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # -------------------------------------------
              # Read database configuration from SSM
              # -------------------------------------------

              - Sid: ReadDatabaseParameters

                Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

              # -------------------------------------------
              # Publish inventory events
              # -------------------------------------------

              - Sid: PublishInventoryEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource: '*'


  # =======================================================
  # 3. ORDER LAMBDA ROLE
  # =======================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-OrderLambdaRole

      Description:
        IAM execution role for CloudMart Order Lambda

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole


      Policies:

        - PolicyName:
            !Sub CloudMart-${Environment}-OrderAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # -------------------------------------------
              # Read DB credentials/configuration
              # -------------------------------------------

              - Sid: ReadDatabaseParameters

                Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

              # -------------------------------------------
              # Publish order events
              # -------------------------------------------

              - Sid: PublishOrderEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource: '*'

              # -------------------------------------------
              # Publish notifications
              # -------------------------------------------

              - Sid: PublishNotifications

                Effect: Allow

                Action:
                  - sns:Publish

                Resource: '*'


  # =======================================================
  # 4. INVENTORY ALERT LAMBDA ROLE
  # =======================================================

  InventoryAlertLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-InventoryAlertLambdaRole

      Description:
        IAM execution role for CloudMart Inventory Alert Lambda

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole


      Policies:

        - PolicyName:
            !Sub CloudMart-${Environment}-InventoryAlertAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # -------------------------------------------
              # Read database configuration
              # -------------------------------------------

              - Sid: ReadDatabaseParameters

                Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

              # -------------------------------------------
              # Read low-stock threshold from SSM
              # -------------------------------------------

              - Sid: ReadLowStockConfiguration

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/inventory/*

              # -------------------------------------------
              # Publish low-stock notification
              # -------------------------------------------

              - Sid: PublishLowStockAlert

                Effect: Allow

                Action:
                  - sns:Publish

                Resource: '*'


  # =======================================================
  # 5. REPORT GENERATOR LAMBDA ROLE
  # =======================================================

  ReportGeneratorLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-ReportGeneratorLambdaRole

      Description:
        IAM execution role for CloudMart Report Generator Lambda

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole


      Policies:

        - PolicyName:
            !Sub CloudMart-${Environment}-ReportAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # -------------------------------------------
              # Read DB configuration
              # -------------------------------------------

              - Sid: ReadDatabaseParameters

                Effect: Allow

                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

              # -------------------------------------------
              # Write generated reports to S3
              # -------------------------------------------

              - Sid: WriteReports

                Effect: Allow

                Action:
                  - s3:PutObject

                Resource:
                  !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}/*

              # -------------------------------------------
              # Read report bucket if required
              # -------------------------------------------

              - Sid: ReadReports

                Effect: Allow

                Action:
                  - s3:GetObject

                Resource:
                  !Sub arn:${AWS::Partition}:s3:::cloudmart-${Environment}-reports-${AWS::AccountId}/*


# =========================================================
# OUTPUTS
# =========================================================

Outputs:


  # =======================================================
  # AUTHORIZER ROLE
  # =======================================================

  AuthorizerLambdaRoleArn:

    Description:
      ARN of the CloudMart Authorizer Lambda IAM role

    Value:
      !GetAtt AuthorizerLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaRoleArn


  # =======================================================
  # PRODUCT ROLE
  # =======================================================

  ProductLambdaRoleArn:

    Description:
      ARN of the CloudMart Product Lambda IAM role

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  # =======================================================
  # ORDER ROLE
  # =======================================================

  OrderLambdaRoleArn:

    Description:
      ARN of the CloudMart Order Lambda IAM role

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderLambdaRoleArn


  # =======================================================
  # INVENTORY ALERT ROLE
  # =======================================================

  InventoryAlertLambdaRoleArn:

    Description:
      ARN of the CloudMart Inventory Alert Lambda IAM role

    Value:
      !GetAtt InventoryAlertLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-InventoryAlertLambdaRoleArn


  # =======================================================
  # REPORT GENERATOR ROLE
  # =======================================================

  ReportGeneratorLambdaRoleArn:

    Description:
      ARN of the CloudMart Report Generator Lambda IAM role

    Value:
      !GetAtt ReportGeneratorLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportGeneratorLambdaRoleArn