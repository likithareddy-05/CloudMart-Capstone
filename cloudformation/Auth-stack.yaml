AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Authentication Stack.
  Creates USER and ADMIN authentication tokens
  in SSM Parameter Store and a Lambda Authorizer
  for API Gateway.


# =========================================================
# PARAMETERS
# =========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


  UserToken:
    Type: String
    NoEcho: true

    Description: >
      Authentication token for USER role.
      Supplied securely through GitHub Actions.


  AdminToken:
    Type: String
    NoEcho: true

    Description: >
      Authentication token for ADMIN role.
      Supplied securely through GitHub Actions.


  LambdaS3Key:
    Type: String

    Default: authorizer/authorizer.zip

    Description: >
      S3 key containing the Authorizer Lambda package.


# =========================================================
# RESOURCES
# =========================================================

Resources:


  # =======================================================
  # USER TOKEN - SSM SECURE STRING
  # =======================================================

  UserTokenParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/auth/user-token

      Type: SecureString

      Value:
        !Ref UserToken

      Description:
        !Sub CloudMart ${Environment} USER authentication token


  # =======================================================
  # ADMIN TOKEN - SSM SECURE STRING
  # =======================================================

  AdminTokenParameter:

    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/auth/admin-token

      Type: SecureString

      Value:
        !Ref AdminToken

      Description:
        !Sub CloudMart ${Environment} ADMIN authentication token


  # =======================================================
  # AUTHORIZER IAM ROLE
  # =======================================================

  AuthorizerExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-AuthorizerRole


      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      Policies:


        # -------------------------------------------------
        # CLOUDWATCH LOGGING
        # -------------------------------------------------

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:

                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


        # -------------------------------------------------
        # SSM TOKEN ACCESS
        # -------------------------------------------------

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ssm:GetParameter

                Resource:

                  - !GetAtt UserTokenParameter.Arn
                  - !GetAtt AdminTokenParameter.Arn


  # =======================================================
  # AUTHORIZER LAMBDA
  # =======================================================

  AuthorizerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-Authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        !GetAtt AuthorizerExecutionRole.Arn

      Timeout: 10

      MemorySize: 128


      # ---------------------------------------------------
      # ENVIRONMENT VARIABLES
      # ---------------------------------------------------

      Environment:

        Variables:

          USER_TOKEN_PARAMETER:
            !Ref UserTokenParameter

          ADMIN_TOKEN_PARAMETER:
            !Ref AdminTokenParameter


      # ---------------------------------------------------
      # LAMBDA PACKAGE
      # ---------------------------------------------------

      Code:

        S3Bucket:

          Fn::ImportValue:
            !Sub CloudMart-${Environment}-LambdaBucket

        S3Key:
          !Ref LambdaS3Key


  # =======================================================
  # API GATEWAY INVOKE PERMISSION
  # =======================================================

  AuthorizerInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com


# =========================================================
# OUTPUTS
# =========================================================

Outputs:


  # =======================================================
  # USER TOKEN PARAMETER
  # =======================================================

  UserTokenParameterName:

    Description:
      USER token SSM parameter name

    Value:
      !Ref UserTokenParameter


  # =======================================================
  # ADMIN TOKEN PARAMETER
  # =======================================================

  AdminTokenParameterName:

    Description:
      ADMIN token SSM parameter name

    Value:
      !Ref AdminTokenParameter


  # =======================================================
  # AUTHORIZE LAMBDA ARN
  # =======================================================

  AuthorizerLambdaArn:

    Description:
      CloudMart Lambda Authorizer ARN

    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:

      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaArn


  # =======================================================
  # AUTHORIZE LAMBDA NAME
  # =======================================================

  AuthorizerLambdaName:

    Description:
      CloudMart Authorizer Lambda name

    Value:
      !Ref AuthorizerLambda

    Export:

      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaName


  # =======================================================
  # AUTHORIZE ROLE ARN
  # =======================================================

  AuthorizerRoleArn:

    Description:
      CloudMart Authorizer IAM Role ARN

    Value:
      !GetAtt AuthorizerExecutionRole.Arn

    Export:

      Name:
        !Sub CloudMart-${Environment}-AuthorizerRoleArn