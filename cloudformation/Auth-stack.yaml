AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Authentication Stack.
  Creates the Lambda Authorizer used by API Gateway.
  Authentication tokens are stored as SecureString
  parameters in AWS Systems Manager Parameter Store.


# =========================================================
# PARAMETERS
# =========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


  UserTokenParameterName:
    Type: String

    Default: /cloudmart/dev/auth/user-token

    Description: >
      SSM Parameter Store path containing the
      USER authentication token.


  AdminTokenParameterName:
    Type: String

    Default: /cloudmart/dev/auth/admin-token

    Description: >
      SSM Parameter Store path containing the
      ADMIN authentication token.


  LambdaS3Key:
    Type: String

    Default: authorizer/authorizer.zip

    Description: >
      S3 key containing the Authorizer Lambda
      deployment package.


# =========================================================
# RESOURCES
# =========================================================

Resources:


  # =======================================================
  # AUTHORIZER IAM ROLE
  # =======================================================

  AuthorizerExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-AuthorizerRole


      # ---------------------------------------------------
      # Lambda trust policy
      # ---------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      # ---------------------------------------------------
      # IAM POLICIES
      # ---------------------------------------------------

      Policies:


        # =================================================
        # CLOUDWATCH LOGGING
        # =================================================

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:

                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


        # =================================================
        # SSM TOKEN ACCESS
        # =================================================

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ssm:GetParameter

                Resource:

                  # USER SecureString
                  - !Sub
                    - arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterName}
                    - ParameterName: !Ref UserTokenParameterName

                  # ADMIN SecureString
                  - !Sub
                    - arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterName}
                    - ParameterName: !Ref AdminTokenParameterName


  # =======================================================
  # AUTHORIZER LAMBDA
  # =======================================================

  AuthorizerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-Authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        !GetAtt AuthorizerExecutionRole.Arn

      Timeout: 10

      MemorySize: 128


      # ---------------------------------------------------
      # ENVIRONMENT VARIABLES
      # ---------------------------------------------------

      Environment:

        Variables:

          USER_TOKEN_PARAMETER:
            !Ref UserTokenParameterName

          ADMIN_TOKEN_PARAMETER:
            !Ref AdminTokenParameterName


      # ---------------------------------------------------
      # LAMBDA CODE
      # ---------------------------------------------------

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub CloudMart-${Environment}-LambdaBucket

        S3Key:
          !Ref LambdaS3Key


  # =======================================================
  # API GATEWAY PERMISSION
  # =======================================================

  AuthorizerInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com


# =========================================================
# OUTPUTS
# =========================================================

Outputs:


  # =======================================================
  # USER PARAMETER NAME
  # =======================================================

  UserTokenParameterName:

    Description:
      USER authentication token SSM parameter name

    Value:
      !Ref UserTokenParameterName

    Export:
      Name:
        !Sub CloudMart-${Environment}-UserTokenParameterName


  # =======================================================
  # ADMIN PARAMETER NAME
  # =======================================================

  AdminTokenParameterName:

    Description:
      ADMIN authentication token SSM parameter name

    Value:
      !Ref AdminTokenParameterName

    Export:
      Name:
        !Sub CloudMart-${Environment}-AdminTokenParameterName


  # =======================================================
  # AUTHORIZE LAMBDA ARN
  # =======================================================

  AuthorizerLambdaArn:

    Description:
      CloudMart Lambda Authorizer ARN

    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaArn


  # =======================================================
  # AUTHORIZE LAMBDA NAME
  # =======================================================

  AuthorizerLambdaName:

    Description:
      CloudMart Authorizer Lambda name

    Value:
      !Ref AuthorizerLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaName


  # =======================================================
  # AUTHORIZE ROLE ARN
  # =======================================================

  AuthorizerRoleArn:

    Description:
      CloudMart Authorizer IAM Role ARN

    Value:
      !GetAtt AuthorizerExecutionRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerRoleArn