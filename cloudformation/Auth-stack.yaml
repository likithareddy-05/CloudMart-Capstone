AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Authentication Stack.
  Creates the Lambda Authorizer used by API Gateway.
  The Authorizer validates bearer tokens against
  SHA-256 token hashes stored in the RDS users table.


# =========================================================
# PARAMETERS
# =========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


  # =======================================================
  # DATABASE SSM PARAMETERS
  # =======================================================

  DbHostParameterName:
    Type: String

    Default: /cloudmart/dev/db/host

    Description: >
      SSM Parameter Store path containing
      the RDS MySQL host.


  DbPortParameterName:
    Type: String

    Default: /cloudmart/dev/db/port

    Description: >
      SSM Parameter Store path containing
      the RDS MySQL port.


  DbNameParameterName:
    Type: String

    Default: /cloudmart/dev/db/name

    Description: >
      SSM Parameter Store path containing
      the CloudMart database name.


  DbUsernameParameterName:
    Type: String

    Default: /cloudmart/dev/db/username

    Description: >
      SSM Parameter Store path containing
      the RDS database username.


  DbPasswordParameterName:
    Type: String

    Default: /cloudmart/dev/db/password

    Description: >
      SSM SecureString parameter containing
      the RDS database password.


  # =======================================================
  # LAMBDA PACKAGE
  # =======================================================

  LambdaS3Key:
    Type: String

    Default: authorizer/authorizer.zip

    Description: >
      S3 key containing the Authorizer Lambda
      deployment package.


# =========================================================
# RESOURCES
# =========================================================

Resources:


  # =======================================================
  # AUTHORIZER IAM ROLE
  # =======================================================

  AuthorizerExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-AuthorizerRole


      # ---------------------------------------------------
      # Lambda trust policy
      # ---------------------------------------------------

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole


      # ---------------------------------------------------
      # IAM POLICIES
      # ---------------------------------------------------

      Policies:


        # =================================================
        # CLOUDWATCH LOGGING
        # =================================================

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerLogs

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:

                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*


        # =================================================
        # SSM DATABASE PARAMETER ACCESS
        # =================================================

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerDBSSM

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - ssm:GetParameter

                Resource:

                  # DB HOST
                  - !Sub
                    - arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterName}
                    - ParameterName: !Ref DbHostParameterName

                  # DB PORT
                  - !Sub
                    - arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterName}
                    - ParameterName: !Ref DbPortParameterName

                  # DB NAME
                  - !Sub
                    - arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterName}
                    - ParameterName: !Ref DbNameParameterName

                  # DB USERNAME
                  - !Sub
                    - arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterName}
                    - ParameterName: !Ref DbUsernameParameterName

                  # DB PASSWORD
                  - !Sub
                    - arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterName}
                    - ParameterName: !Ref DbPasswordParameterName

        - PolicyName:
            !Sub CloudMart-${Environment}-AuthorizerVPCAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"


  # =======================================================
  # AUTHORIZER LAMBDA
  # =======================================================

  AuthorizerLambda:

    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-Authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        !GetAtt AuthorizerExecutionRole.Arn

      Timeout: 10

      MemorySize: 128


      # ---------------------------------------------------
      # VPC CONFIGURATION
      # ---------------------------------------------------

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetId

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId


      # ---------------------------------------------------
      # ENVIRONMENT VARIABLES
      # ---------------------------------------------------

      Environment:

        Variables:

          DB_HOST_PARAMETER:
            !Ref DbHostParameterName

          DB_PORT_PARAMETER:
            !Ref DbPortParameterName

          DB_NAME_PARAMETER:
            !Ref DbNameParameterName

          DB_USERNAME_PARAMETER:
            !Ref DbUsernameParameterName

          DB_PASSWORD_PARAMETER:
            !Ref DbPasswordParameterName


      # ---------------------------------------------------
      # LAMBDA CODE
      # ---------------------------------------------------

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub CloudMart-${Environment}-LambdaBucket

        S3Key:
          !Ref LambdaS3Key


  # =======================================================
  # API GATEWAY PERMISSION
  # =======================================================

  AuthorizerInvokePermission:

    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref AuthorizerLambda

      Action:
        lambda:InvokeFunction

      Principal:
        apigateway.amazonaws.com


# =========================================================
# OUTPUTS
# =========================================================

Outputs:


  # =======================================================
  # AUTHORIZE LAMBDA ARN
  # =======================================================

  AuthorizerLambdaArn:

    Description:
      CloudMart Lambda Authorizer ARN

    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaArn


  # =======================================================
  # AUTHORIZE LAMBDA NAME
  # =======================================================

  AuthorizerLambdaName:

    Description:
      CloudMart Authorizer Lambda name

    Value:
      !Ref AuthorizerLambda

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerLambdaName


  # =======================================================
  # AUTHORIZE ROLE ARN
  # =======================================================

  AuthorizerRoleArn:

    Description:
      CloudMart Authorizer IAM Role ARN

    Value:
      !GetAtt AuthorizerExecutionRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerRoleArn