AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Reporting Stack.
  Creates the Report Generator Lambda and its
  scheduled EventBridge trigger.
  Existing Network, Security and S3 resources are reused.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment

  InstanceType:
    Type: String
    Default: t3.micro

    Description:
      EC2 instance type for the CloudMart dashboard


  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>

    Default:
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

    Description:
      Latest Amazon Linux 2023 AMI


  LambdaS3Bucket:
    Type: String

    Description:
      Existing S3 bucket containing packaged Lambda code


  LambdaS3Key:
    Type: String

    Description:
      S3 key for the reporting Lambda package


  ReportsBucketName:
    Type: String

    Description:
      Existing S3 bucket used to store CloudMart reports


  DbHostParameterName:
    Type: String

    Default: /cloudmart/dev/db/host

    Description:
      SSM parameter containing the RDS MySQL host


  DbPortParameterName:
    Type: String

    Default: /cloudmart/dev/db/port

    Description:
      SSM parameter containing the RDS MySQL port


  DbNameParameterName:
    Type: String

    Default: /cloudmart/dev/db/name

    Description:
      SSM parameter containing the database name


  DbUsernameParameterName:
    Type: String

    Default: /cloudmart/dev/db/username

    Description:
      SSM parameter containing the database username


  DbPasswordParameterName:
    Type: String

    Default: /cloudmart/dev/db/password

    Description:
      SSM SecureString parameter containing the database password


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ============================================================
  # REPORT GENERATOR LAMBDA
  # ============================================================

  ReportGeneratorLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-ReportGenerator

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Timeout: 60

      MemorySize: 256


      # --------------------------------------------------------
      # EXISTING SECURITY STACK ROLE
      # --------------------------------------------------------

      Role:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-ReportGeneratorLambdaRoleArn


      # --------------------------------------------------------
      # LAMBDA CODE
      # --------------------------------------------------------

      Code:

        S3Bucket:
          !Ref LambdaS3Bucket

        S3Key:
          !Ref LambdaS3Key


      # --------------------------------------------------------
      # EXISTING NETWORK RESOURCES
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetId

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId


      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          REPORTS_BUCKET:
            !Ref ReportsBucketName

          DB_HOST_PARAMETER:
            !Ref DbHostParameterName

          DB_PORT_PARAMETER:
            !Ref DbPortParameterName

          DB_NAME_PARAMETER:
            !Ref DbNameParameterName

          DB_USERNAME_PARAMETER:
            !Ref DbUsernameParameterName

          DB_PASSWORD_PARAMETER:
            !Ref DbPasswordParameterName


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # EVENTBRIDGE DAILY REPORT SCHEDULE
  # ============================================================

  DailyReportSchedule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-DailyReport

      Description:
        !Sub Daily CloudMart report generation for ${Environment}


      # --------------------------------------------------------
      # 03:00 UTC = 08:30 IST
      # --------------------------------------------------------

      ScheduleExpression:
        cron(0 3 * * ? *)


      State: ENABLED


      Targets:

        - Arn:
            !GetAtt ReportGeneratorLambda.Arn

          Id:
            ReportGeneratorTarget


  # ============================================================
  # ALLOW EVENTBRIDGE TO INVOKE REPORT LAMBDA
  # ============================================================

  ReportLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref ReportGeneratorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt DailyReportSchedule.Arn


    # ============================================================
  # EC2 FLASK DASHBOARD
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      # --------------------------------------------------------
      # AMAZON LINUX 2023
      # --------------------------------------------------------

      ImageId:
        !Ref LatestAmiId


      # --------------------------------------------------------
      # INSTANCE SIZE
      # --------------------------------------------------------

      InstanceType:
        !Ref InstanceType


      # --------------------------------------------------------
      # EXISTING SECURITY STACK INSTANCE PROFILE
      # --------------------------------------------------------

      IamInstanceProfile:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-DashboardInstanceProfileName


      # --------------------------------------------------------
      # EXISTING NETWORK PUBLIC SUBNET
      # --------------------------------------------------------

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId


      # --------------------------------------------------------
      # EXISTING EC2 DASHBOARD SECURITY GROUP
      # --------------------------------------------------------

      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-${Environment}-Dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


      # ========================================================
      # USER DATA
      # ========================================================

      UserData:

        Fn::Base64:

          !Sub |

            #!/bin/bash

            set -e

            exec > >(tee /var/log/cloudmart-userdata.log | logger -t cloudmart-userdata -s 2>/dev/console) 2>&1


            echo "===================================================="
            echo "CloudMart Dashboard UserData started"
            echo "===================================================="


            # ==================================================
            # SYSTEM UPDATE
            # ==================================================

            dnf update -y


            # ==================================================
            # INSTALL REQUIRED PACKAGES
            # ==================================================

            dnf install -y \
              python3 \
              python3-pip \
              nginx \
              amazon-ssm-agent


            # ==================================================
            # START SSM AGENT
            # ==================================================

            systemctl enable amazon-ssm-agent
            systemctl start amazon-ssm-agent


            # ==================================================
            # CREATE DASHBOARD DIRECTORY
            # ==================================================

            mkdir -p /opt/cloudmart-dashboard
            mkdir -p /opt/cloudmart-dashboard/templates


            # ==================================================
            # CREATE FLASK APPLICATION
            # ==================================================

            cat > /opt/cloudmart-dashboard/app.py <<'PYTHON'

            import logging
            import os
            from datetime import datetime

            import boto3
            import pymysql

            from flask import Flask, render_template


            app = Flask(__name__)

            logging.basicConfig(level=logging.INFO)


            ENVIRONMENT = os.environ.get(
                "ENVIRONMENT",
                "dev"
            )


            AWS_REGION = os.environ.get(
                "AWS_REGION",
                "ap-south-1"
            )


            REPORTS_BUCKET = os.environ.get(
                "REPORTS_BUCKET"
            )


            # --------------------------------------------------
            # ACTUAL CLOUDMART SSM PATHS
            # --------------------------------------------------

            DB_HOST_PARAMETER = (
                f"/cloudmart/{ENVIRONMENT}/db/host"
            )

            DB_PORT_PARAMETER = (
                f"/cloudmart/{ENVIRONMENT}/db/port"
            )

            DB_NAME_PARAMETER = (
                f"/cloudmart/{ENVIRONMENT}/db/name"
            )

            DB_USERNAME_PARAMETER = (
                f"/cloudmart/{ENVIRONMENT}/db/username"
            )

            DB_PASSWORD_PARAMETER = (
                f"/cloudmart/{ENVIRONMENT}/db/password"
            )


            # --------------------------------------------------
            # AWS CLIENTS
            # --------------------------------------------------

            ssm = boto3.client(
                "ssm",
                region_name=AWS_REGION
            )


            s3 = boto3.client(
                "s3",
                region_name=AWS_REGION
            )


            # --------------------------------------------------
            # GET SSM PARAMETER
            # --------------------------------------------------

            def get_parameter(name):

                result = ssm.get_parameter(
                    Name=name,
                    WithDecryption=True
                )

                return result["Parameter"]["Value"]


            # --------------------------------------------------
            # DATABASE CONNECTION
            # --------------------------------------------------

            def get_db_connection():

                host = get_parameter(
                    DB_HOST_PARAMETER
                )

                port = int(
                    get_parameter(
                        DB_PORT_PARAMETER
                    )
                )

                database = get_parameter(
                    DB_NAME_PARAMETER
                )

                username = get_parameter(
                    DB_USERNAME_PARAMETER
                )

                password = get_parameter(
                    DB_PASSWORD_PARAMETER
                )

                return pymysql.connect(

                    host=host,

                    port=port,

                    user=username,

                    password=password,

                    database=database,

                    connect_timeout=10,

                    cursorclass=pymysql.cursors.DictCursor
                )


            # --------------------------------------------------
            # CURRENT PRODUCT INVENTORY
            # --------------------------------------------------

            def get_products():

                connection = None

                try:

                    connection = get_db_connection()

                    with connection.cursor() as cursor:

                        cursor.execute(
                            """
                            SELECT
                                id,
                                name,
                                description,
                                price,
                                category,
                                stock_count
                            FROM products
                            WHERE is_deleted = FALSE
                            ORDER BY id
                            """
                        )

                        return cursor.fetchall()

                finally:

                    if connection:
                        connection.close()


            # --------------------------------------------------
            # RECENT ORDERS
            # --------------------------------------------------

            def get_recent_orders():

                connection = None

                try:

                    connection = get_db_connection()

                    with connection.cursor() as cursor:

                        cursor.execute(
                            """
                            SELECT
                                o.id AS order_id,
                                o.customer_id,
                                o.status,
                                o.created_at,
                                oi.product_id,
                                p.name AS product_name,
                                oi.quantity,
                                oi.price
                            FROM orders o
                            INNER JOIN order_items oi
                                ON o.id = oi.order_id
                            INNER JOIN products p
                                ON oi.product_id = p.id
                            WHERE o.is_deleted = FALSE
                              AND oi.is_deleted = FALSE
                            ORDER BY
                                o.created_at DESC,
                                oi.id DESC
                            LIMIT 20
                            """
                        )

                        return cursor.fetchall()

                finally:

                    if connection:
                        connection.close()


            # --------------------------------------------------
            # LATEST S3 REPORT
            # --------------------------------------------------

            def get_latest_report():

                if not REPORTS_BUCKET:
                    return None


                result = s3.list_objects_v2(

                    Bucket=REPORTS_BUCKET,

                    Prefix="reports/"
                )


                contents = result.get(
                    "Contents",
                    []
                )


                if not contents:
                    return None


                latest = max(

                    contents,

                    key=lambda item:
                        item["LastModified"]
                )


                object_key = latest["Key"]


                url = s3.generate_presigned_url(

                    "get_object",

                    Params={

                        "Bucket":
                            REPORTS_BUCKET,

                        "Key":
                            object_key
                    },

                    ExpiresIn=3600
                )


                return {

                    "key":
                        object_key,

                    "url":
                        url,

                    "last_modified":
                        latest["LastModified"]
                }


            # --------------------------------------------------
            # DASHBOARD
            # --------------------------------------------------

            @app.route("/")
            def dashboard():

                try:

                    products = get_products()

                    orders = get_recent_orders()

                    latest_report = get_latest_report()


                    return render_template(

                        "index.html",

                        products=products,

                        orders=orders,

                        latest_report=latest_report,

                        generated_at=datetime.now()
                    )


                except Exception as error:

                    app.logger.exception(
                        "Dashboard error"
                    )

                    return (

                        f"""
                        <h1>CloudMart Dashboard</h1>
                        <h2>Dashboard Error</h2>
                        <pre>{error}</pre>
                        """,

                        500
                    )


            # --------------------------------------------------
            # HEALTH CHECK
            # --------------------------------------------------

            @app.route("/health")
            def health():

                return {

                    "status":
                        "healthy",

                    "service":
                        "cloudmart-dashboard"
                }


            if __name__ == "__main__":

                app.run(

                    host="127.0.0.1",

                    port=5000
                )

            PYTHON


            # ==================================================
            # CREATE HTML TEMPLATE
            # ==================================================

            cat > /opt/cloudmart-dashboard/templates/index.html <<'HTML'

            <!DOCTYPE html>

            <html lang="en">

            <head>

                <meta charset="UTF-8">

                <meta
                    name="viewport"
                    content="width=device-width, initial-scale=1.0">

                <title>
                    CloudMart Operations Dashboard
                </title>

                <style>

                    body {
                        font-family: Arial, sans-serif;
                        margin: 0;
                        padding: 30px;
                        background: #f5f6f8;
                    }

                    h1 {
                        margin-bottom: 5px;
                    }

                    .subtitle {
                        color: #666;
                        margin-bottom: 30px;
                    }

                    .card {
                        background: white;
                        padding: 20px;
                        margin-bottom: 25px;
                        border-radius: 8px;
                        box-shadow:
                            0 2px 8px
                            rgba(0,0,0,0.08);
                    }

                    table {
                        width: 100%;
                        border-collapse: collapse;
                    }

                    th,
                    td {
                        padding: 10px;
                        border-bottom: 1px solid #ddd;
                        text-align: left;
                    }

                    th {
                        background: #f0f1f3;
                    }

                    .low-stock {
                        font-weight: bold;
                    }

                    .report-link {
                        display: inline-block;
                        padding: 10px 15px;
                        background: #222;
                        color: white;
                        text-decoration: none;
                        border-radius: 5px;
                    }

                </style>

            </head>


            <body>

                <h1>
                    CloudMart Operations Dashboard
                </h1>

                <div class="subtitle">
                    Environment: ${Environment}
                </div>


                <!-- ========================================= -->
                <!-- LATEST REPORT -->
                <!-- ========================================= -->

                <div class="card">

                    <h2>
                        Latest Daily Report
                    </h2>


                    {% if latest_report %}

                        <p>
                            {{ latest_report.key }}
                        </p>

                        <p>

                            Last modified:

                            {{ latest_report.last_modified }}

                        </p>


                        <a
                            class="report-link"
                            href="{{ latest_report.url }}"
                            target="_blank">

                            Open Latest Report

                        </a>

                    {% else %}

                        <p>
                            No report available.
                        </p>

                    {% endif %}

                </div>


                <!-- ========================================= -->
                <!-- INVENTORY -->
                <!-- ========================================= -->

                <div class="card">

                    <h2>
                        Current Product Inventory
                    </h2>


                    <table>

                        <tr>

                            <th>ID</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>

                        </tr>


                        {% for product in products %}

                        <tr>

                            <td>
                                {{ product.id }}
                            </td>

                            <td>
                                {{ product.name }}
                            </td>

                            <td>
                                {{ product.category }}
                            </td>

                            <td>
                                ₹{{ product.price }}
                            </td>

                            <td
                                class="{% if product.stock_count <= 5 %}low-stock{% endif %}">

                                {{ product.stock_count }}

                            </td>

                        </tr>

                        {% endfor %}

                    </table>

                </div>


                <!-- ========================================= -->
                <!-- RECENT ORDERS -->
                <!-- ========================================= -->

                <div class="card">

                    <h2>
                        Recent Orders
                    </h2>


                    <table>

                        <tr>

                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Status</th>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Created</th>

                        </tr>


                        {% for order in orders %}

                        <tr>

                            <td>
                                {{ order.order_id }}
                            </td>

                            <td>
                                {{ order.customer_id }}
                            </td>

                            <td>
                                {{ order.status }}
                            </td>

                            <td>
                                {{ order.product_name }}
                            </td>

                            <td>
                                {{ order.quantity }}
                            </td>

                            <td>
                                ₹{{ order.price }}
                            </td>

                            <td>
                                {{ order.created_at }}
                            </td>

                        </tr>

                        {% endfor %}

                    </table>

                </div>

            </body>

            </html>

            HTML


            # ==================================================
            # PYTHON REQUIREMENTS
            # ==================================================

            cat > /opt/cloudmart-dashboard/requirements.txt <<'REQUIREMENTS'

            Flask
            boto3
            PyMySQL
            gunicorn

            REQUIREMENTS


            # ==================================================
            # INSTALL DEPENDENCIES
            # ==================================================

            python3 -m pip install \
              -r /opt/cloudmart-dashboard/requirements.txt


            # ==================================================
            # SYSTEMD SERVICE
            # ==================================================

            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICE

            [Unit]

            Description=CloudMart Flask Dashboard

            After=network-online.target

            Wants=network-online.target


            [Service]

            User=root

            WorkingDirectory=/opt/cloudmart-dashboard

            Environment="ENVIRONMENT=${Environment}"

            Environment="AWS_REGION=${AWS::Region}"

            Environment="REPORTS_BUCKET=${ReportsBucketName}"

            ExecStart=/usr/local/bin/gunicorn \
              --workers 2 \
              --bind 127.0.0.1:5000 \
              app:app

            Restart=always

            RestartSec=5


            [Install]

            WantedBy=multi-user.target

            SERVICE


            # ==================================================
            # NGINX CONFIGURATION
            # ==================================================

            cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINX'

            server {

                listen 80;

                server_name _;


                location / {

                    proxy_pass
                        http://127.0.0.1:5000;

                    proxy_set_header
                        Host $host;

                    proxy_set_header
                        X-Real-IP $remote_addr;

                    proxy_set_header
                        X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header
                        X-Forwarded-Proto $scheme;
                }

            }

            NGINX


            # ==================================================
            # START DASHBOARD
            # ==================================================

            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard


            sleep 5


            # ==================================================
            # HEALTH CHECK
            # ==================================================

            curl --fail \
              http://127.0.0.1:5000/health


            # ==================================================
            # START NGINX
            # ==================================================

            systemctl enable nginx

            nginx -t

            systemctl restart nginx


            echo "===================================================="
            echo "CloudMart Dashboard deployed successfully"
            echo "===================================================="


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ============================================================
  # EXISTING REPORTS BUCKET
  # ============================================================

  ReportsBucketName:

    Description:
      Existing CloudMart reports S3 bucket

    Value:
      !Ref ReportsBucketName


  # ============================================================
  # REPORT LAMBDA
  # ============================================================

  ReportLambdaName:

    Description:
      CloudMart Report Generator Lambda

    Value:
      !Ref ReportGeneratorLambda


  ReportLambdaArn:

    Description:
      CloudMart Report Generator Lambda ARN

    Value:
      !GetAtt ReportGeneratorLambda.Arn


  # ============================================================
  # DAILY REPORT EVENTBRIDGE RULE
  # ============================================================

  DailyReportRuleArn:

    Description:
      Daily report EventBridge rule ARN

    Value:
      !GetAtt DailyReportSchedule.Arn


    # ============================================================
  # DASHBOARD INSTANCE
  # ============================================================

  DashboardInstanceId:

    Description:
      CloudMart dashboard EC2 instance ID

    Value:
      !Ref DashboardEC2


  DashboardPublicIp:

    Description:
      CloudMart dashboard public IP

    Value:
      !GetAtt DashboardEC2.PublicIp


  DashboardURL:

    Description:
      CloudMart dashboard URL

    Value:
      !Sub
        http://${DashboardEC2.PublicIp}