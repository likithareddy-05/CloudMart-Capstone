AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Reporting Stack.
  Creates the Report Generator Lambda, daily EventBridge schedule,
  and the Flask dashboard EC2 instance.
  Dashboard source files are downloaded from S3 automatically
  during EC2 bootstrap.

# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment


  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the CloudMart dashboard


  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI


  LambdaS3Bucket:
    Type: String
    Description: Existing S3 bucket containing packaged Lambda code


  LambdaS3Key:
    Type: String
    Description: S3 key for the reporting Lambda package


  ReportsBucketName:
    Type: String
    Description: Existing S3 bucket used to store CloudMart reports


  DashboardS3Bucket:
    Type: String
    Description: >
      Existing S3 bucket containing the CloudMart dashboard source files.


  DashboardS3Prefix:
    Type: String
    Default: cloudmart-dashboard
    Description: >
      S3 prefix containing app.py and index.html.
      Do not include a leading or trailing slash.


  DbHostParameterName:
    Type: String
    Default: /cloudmart/dev/db/host
    Description: SSM parameter containing the RDS MySQL host


  DbPortParameterName:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: SSM parameter containing the RDS MySQL port


  DbNameParameterName:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing the database name


  DbUsernameParameterName:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM parameter containing the database username


  DbPasswordParameterName:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: SSM SecureString parameter containing the database password


# ==========================================================
# RESOURCES
# ==========================================================

Resources:


  # ==========================================================
  # REPORT GENERATOR LOG GROUP
  # ==========================================================

  ReportGeneratorLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        !Sub /aws/lambda/CloudMart-${Environment}-ReportGenerator

      RetentionInDays: 14

      Tags:
        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # REPORT GENERATOR LAMBDA
  # ==========================================================

  ReportGeneratorLambda:
    Type: AWS::Lambda::Function

    DependsOn:
      - ReportGeneratorLogGroup

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-ReportGenerator

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Timeout: 60

      MemorySize: 256

      Role:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-ReportGeneratorLambdaRoleArn

      Code:

        S3Bucket:
          !Ref LambdaS3Bucket

        S3Key:
          !Ref LambdaS3Key


      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetId

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId


      Environment:

        Variables:

          REPORTS_BUCKET:
            !Ref ReportsBucketName

          DB_HOST_PARAMETER:
            !Ref DbHostParameterName

          DB_PORT_PARAMETER:
            !Ref DbPortParameterName

          DB_NAME_PARAMETER:
            !Ref DbNameParameterName

          DB_USERNAME_PARAMETER:
            !Ref DbUsernameParameterName

          DB_PASSWORD_PARAMETER:
            !Ref DbPasswordParameterName


      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # DAILY REPORT EVENTBRIDGE RULE
  # ==========================================================

  DailyReportSchedule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-DailyReport

      Description:
        !Sub Daily CloudMart report generation for ${Environment}

      # 03:00 UTC = 08:30 IST
      ScheduleExpression: cron(0 3 * * ? *)

      State: ENABLED

      Targets:

        - Arn:
            !GetAtt ReportGeneratorLambda.Arn

          Id: ReportGeneratorTarget

          RetryPolicy:

            MaximumEventAgeInSeconds: 3600

            MaximumRetryAttempts: 3


        - Arn:
            !GetAtt ReportingEventBridgeLogGroup.Arn

          Id: ReportingEventBridgeLogTarget


  # ==========================================================
  # EVENTBRIDGE LOG GROUP
  # ==========================================================

  ReportingEventBridgeLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        !Sub /aws/events/CloudMart-${Environment}-Reporting

      RetentionInDays: 14

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # EVENTBRIDGE LOGGING RESOURCE POLICY
  # ==========================================================

  ReportingEventBridgeLogPolicy:
    Type: AWS::Logs::ResourcePolicy

    Properties:

      PolicyName:
        !Sub CloudMart-${Environment}-ReportingEventBridgeLogsPolicy

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - events.amazonaws.com

            Action:

              - logs:CreateLogStream
              - logs:PutLogEvents

            Resource:
              !Sub ${ReportingEventBridgeLogGroup.Arn}:*

            Condition:

              StringEquals:

                aws:SourceAccount:
                  !Ref AWS::AccountId


  # ==========================================================
  # LAMBDA PERMISSION FOR EVENTBRIDGE
  # ==========================================================

  ReportLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref ReportGeneratorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt DailyReportSchedule.Arn


  # ==========================================================
  # DASHBOARD EC2
  # ==========================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    CreationPolicy:

      ResourceSignal:

        Count: 1

        Timeout: PT15M

    Properties:

      ImageId:
        !Ref LatestAmiId

      InstanceType:
        !Ref InstanceType

      IamInstanceProfile:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-DashboardInstanceProfileName

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId

      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId


      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-${Environment}-Dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


      # ======================================================
      # EC2 USER DATA
      # ======================================================

      UserData:

        Fn::Base64:

          !Sub |

            #!/bin/bash

            set -Eeuo pipefail


            # =================================================
            # LOGGING
            # =================================================

            LOG_FILE="/var/log/cloudmart-dashboard-userdata.log"

            exec > >(tee -a "$LOG_FILE" | logger -t cloudmart-dashboard-userdata -s 2>/dev/console) 2>&1


            echo "=================================================="
            echo "CloudMart Dashboard Bootstrap Started"
            echo "=================================================="


            # =================================================
            # CLOUDFORMATION SIGNAL FUNCTION
            # =================================================

            SIGNAL_SENT=false

            send_signal() {

                EXIT_CODE=$?

                if [ "$SIGNAL_SENT" = "false" ]; then

                    echo "Sending CloudFormation signal. Exit code: $EXIT_CODE"

                    /opt/aws/bin/cfn-signal \
                      --exit-code "$EXIT_CODE" \
                      --stack "${AWS::StackName}" \
                      --resource DashboardEC2 \
                      --region "${AWS::Region}" || true

                    SIGNAL_SENT=true

                fi

                exit "$EXIT_CODE"

            }

            trap send_signal EXIT


            # =================================================
            # ENVIRONMENT VARIABLES
            # =================================================

            export ENVIRONMENT='${Environment}'

            export AWS_REGION='${AWS::Region}'

            export REPORTS_BUCKET='${ReportsBucketName}'

            export DB_HOST_PARAMETER='${DbHostParameterName}'

            export DB_PORT_PARAMETER='${DbPortParameterName}'

            export DB_NAME_PARAMETER='${DbNameParameterName}'

            export DB_USERNAME_PARAMETER='${DbUsernameParameterName}'

            export DB_PASSWORD_PARAMETER='${DbPasswordParameterName}'

            export SESSION_TIMEOUT_MINUTES='60'


            echo "Environment: $ENVIRONMENT"

            echo "AWS Region: $AWS_REGION"


            # =================================================
            # WAIT FOR NETWORK
            # =================================================

            echo "Waiting for network connectivity..."

            for i in {1..30}; do

                if curl -fsS --connect-timeout 5 https://aws.amazon.com >/dev/null 2>&1; then

                    echo "Network connectivity available."

                    break

                fi

                echo "Network not ready. Attempt $i/30"

                sleep 5

            done


            # =================================================
            # UPDATE SYSTEM PACKAGES
            # =================================================

            echo "Updating system packages..."

            dnf update -y


            # =================================================
            # INSTALL REQUIRED SYSTEM PACKAGES
            # =================================================

            echo "Installing required system packages..."

            dnf install -y \
              python3 \
              python3-pip \
              python3-devel \
              nginx \
              openssl \
              curl \
              unzip \
              awscli-2 \
              aws-cfn-bootstrap


            echo "System packages installed successfully."


            # =================================================
            # VERIFY AWS CLI
            # =================================================

            echo "Checking AWS CLI..."

            aws --version


            # =================================================
            # DASHBOARD DIRECTORY
            # =================================================

            DASHBOARD_DIR="/opt/cloudmart-dashboard"

            mkdir -p "$DASHBOARD_DIR"

            cd "$DASHBOARD_DIR"


            echo "Dashboard directory: $DASHBOARD_DIR"


            # =================================================
            # CREATE FLASK SESSION SECRET
            # =================================================

            echo "Creating Flask session secret..."

            if [ ! -s /etc/cloudmart-dashboard-secret ]; then

                umask 077

                openssl rand -hex 32 \
                  > /etc/cloudmart-dashboard-secret

            fi

            chmod 600 /etc/cloudmart-dashboard-secret

            echo "Flask session secret ready."


            # =================================================
            # DOWNLOAD DASHBOARD SOURCE FILES FROM S3
            # =================================================

            echo "Downloading dashboard source files from S3..."

            APP_S3_PATH="s3://${DashboardS3Bucket}/${DashboardS3Prefix}/app.py"

            INDEX_S3_PATH="s3://${DashboardS3Bucket}/${DashboardS3Prefix}/index.html"


            echo "Downloading app.py..."

            for attempt in {1..5}; do

                if aws s3 cp \
                  "$APP_S3_PATH" \
                  "$DASHBOARD_DIR/app.py"; then

                    echo "app.py downloaded successfully."

                    break

                fi

                echo "Failed to download app.py. Attempt $attempt/5"

                if [ "$attempt" -eq 5 ]; then

                    echo "ERROR: Could not download app.py."

                    exit 1

                fi

                sleep 10

            done


            echo "Downloading index.html..."

            for attempt in {1..5}; do

                if aws s3 cp \
                  "$INDEX_S3_PATH" \
                  "$DASHBOARD_DIR/index.html"; then

                    echo "index.html downloaded successfully."

                    break

                fi

                echo "Failed to download index.html. Attempt $attempt/5"

                if [ "$attempt" -eq 5 ]; then

                    echo "ERROR: Could not download index.html."

                    exit 1

                fi

                sleep 10

            done


            # =================================================
            # VERIFY DOWNLOADED FILES
            # =================================================

            echo "Verifying dashboard files..."

            test -s "$DASHBOARD_DIR/app.py"

            test -s "$DASHBOARD_DIR/index.html"


            echo "Dashboard files downloaded successfully."

            echo "Files present:"

            ls -lah "$DASHBOARD_DIR"


            # =================================================
            # CREATE PYTHON VIRTUAL ENVIRONMENT
            # =================================================

            echo "Creating Python virtual environment..."

            python3 -m venv "$DASHBOARD_DIR/venv"


            # =================================================
            # INSTALL PYTHON DEPENDENCIES
            # =================================================

            echo "Installing Python dependencies..."

            "$DASHBOARD_DIR/venv/bin/python" \
              -m pip install --upgrade pip


            "$DASHBOARD_DIR/venv/bin/pip" install \
              Flask \
              boto3 \
              PyMySQL \
              gunicorn


            echo "Python dependencies installed successfully."


            # =================================================
            # PYTHON SYNTAX VALIDATION
            # =================================================

            echo "Validating app.py..."

            "$DASHBOARD_DIR/venv/bin/python" \
              -m py_compile \
              "$DASHBOARD_DIR/app.py"


            echo "app.py syntax validation successful."


            # =================================================
            # CREATE SYSTEMD SERVICE FOR GUNICORN
            # =================================================

            echo "Creating CloudMart dashboard systemd service..."


            cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICE

            [Unit]

            Description=CloudMart Flask Dashboard

            After=network-online.target

            Wants=network-online.target


            [Service]

            Type=simple

            User=root

            WorkingDirectory=/opt/cloudmart-dashboard


            Environment="ENVIRONMENT=${Environment}"

            Environment="AWS_REGION=${AWS::Region}"

            Environment="REPORTS_BUCKET=${ReportsBucketName}"

            Environment="DB_HOST_PARAMETER=${DbHostParameterName}"

            Environment="DB_PORT_PARAMETER=${DbPortParameterName}"

            Environment="DB_NAME_PARAMETER=${DbNameParameterName}"

            Environment="DB_USERNAME_PARAMETER=${DbUsernameParameterName}"

            Environment="DB_PASSWORD_PARAMETER=${DbPasswordParameterName}"

            Environment="SESSION_TIMEOUT_MINUTES=60"


            ExecStart=/opt/cloudmart-dashboard/venv/bin/gunicorn \
              --workers 2 \
              --bind 127.0.0.1:5000 \
              --access-logfile - \
              --error-logfile - \
              app:app


            Restart=always

            RestartSec=5


            [Install]

            WantedBy=multi-user.target

            SERVICE


            echo "Systemd service created."


            # =================================================
            # CREATE NGINX CONFIGURATION
            # =================================================

            echo "Creating Nginx configuration..."


            cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINX'

            server {

                listen 80;

                server_name _;


                client_max_body_size 10M;


                location / {

                    proxy_pass http://127.0.0.1:5000;

                    proxy_set_header Host $host;

                    proxy_set_header X-Real-IP $remote_addr;

                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                    proxy_set_header X-Forwarded-Proto $scheme;

                }

            }

            NGINX


            echo "Nginx configuration created."


            # =================================================
            # VALIDATE NGINX CONFIGURATION
            # =================================================

            echo "Validating Nginx configuration..."

            nginx -t


            echo "Nginx configuration is valid."


            # =================================================
            # ENABLE AND START GUNICORN
            # =================================================

            echo "Starting CloudMart Gunicorn service..."


            systemctl daemon-reload

            systemctl enable cloudmart-dashboard

            systemctl restart cloudmart-dashboard


            sleep 5


            # =================================================
            # CHECK GUNICORN
            # =================================================

            echo "Checking Gunicorn service..."

            systemctl is-active --quiet cloudmart-dashboard


            echo "Gunicorn service is running."


            # =================================================
            # HEALTH CHECK
            # =================================================

            echo "Checking Flask dashboard health..."

            HEALTH_CHECK_SUCCESS=false


            for attempt in {1..12}; do

                echo "Health check attempt $attempt/12"

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --connect-timeout 5 \
                  http://127.0.0.1:5000/health; then

                    echo

                    echo "Flask health check successful."

                    HEALTH_CHECK_SUCCESS=true

                    break

                fi

                sleep 5

            done


            if [ "$HEALTH_CHECK_SUCCESS" = "false" ]; then

                echo "ERROR: Flask health check failed."

                echo "Gunicorn status:"

                systemctl status cloudmart-dashboard --no-pager || true

                echo "Recent Gunicorn logs:"

                journalctl \
                  -u cloudmart-dashboard \
                  --no-pager \
                  -n 50 || true

                exit 1

            fi


            # =================================================
            # ENABLE AND START NGINX
            # =================================================

            echo "Starting Nginx..."


            systemctl enable nginx

            systemctl restart nginx


            # =================================================
            # CHECK NGINX
            # =================================================

            echo "Checking Nginx service..."

            systemctl is-active --quiet nginx


            echo "Nginx service is running."


            # =================================================
            # FINAL HTTP CHECK
            # =================================================

            echo "Checking dashboard through Nginx..."

            for attempt in {1..12}; do

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --connect-timeout 5 \
                  http://127.0.0.1/health >/dev/null; then

                    echo "Nginx → Gunicorn → Flask check successful."

                    break

                fi

                echo "Nginx health check attempt $attempt/12 failed."

                if [ "$attempt" -eq 12 ]; then

                    echo "ERROR: Nginx final health check failed."

                    systemctl status nginx --no-pager || true

                    exit 1

                fi

                sleep 5

            done


            # =================================================
            # FINAL STATUS
            # =================================================

            echo "=================================================="

            echo "CloudMart Dashboard deployed successfully."

            echo "Environment: ${Environment}"

            echo "AWS Region: ${AWS::Region}"

            echo "Dashboard directory: $DASHBOARD_DIR"

            echo "Gunicorn: RUNNING"

            echo "Nginx: RUNNING"

            echo "Flask: HEALTHY"

            echo "=================================================="


  # ==========================================================
  # ELASTIC IP
  # ==========================================================

  DashboardElasticIP:
    Type: AWS::EC2::EIP

    Properties:

      Domain: vpc

      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-${Environment}-Dashboard-EIP

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # ELASTIC IP ASSOCIATION
  # ==========================================================

  DashboardElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation

    Properties:

      InstanceId:
        !Ref DashboardEC2

      AllocationId:
        !GetAtt DashboardElasticIP.AllocationId


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:


  ReportsBucketName:
    Description: Existing CloudMart reports S3 bucket

    Value:
      !Ref ReportsBucketName


  ReportLambdaName:
    Description: CloudMart Report Generator Lambda

    Value:
      !Ref ReportGeneratorLambda


  ReportLambdaArn:
    Description: CloudMart Report Generator Lambda ARN

    Value:
      !GetAtt ReportGeneratorLambda.Arn


  DailyReportRuleArn:
    Description: Daily report EventBridge rule ARN

    Value:
      !GetAtt DailyReportSchedule.Arn


  DashboardInstanceId:
    Description: CloudMart dashboard EC2 instance ID

    Value:
      !Ref DashboardEC2


  DashboardPublicIp:
    Description: CloudMart dashboard Elastic IP

    Value:
      !Ref DashboardElasticIP


  DashboardURL:
    Description: CloudMart dashboard URL

    Value:
      !Sub http://${DashboardElasticIP}


  DashboardSourceLocation:
    Description: S3 location used by the EC2 dashboard bootstrap

    Value:
      !Sub s3://${DashboardS3Bucket}/${DashboardS3Prefix}/