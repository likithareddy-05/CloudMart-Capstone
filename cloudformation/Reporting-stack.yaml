AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Reporting Stack.
  Creates the Report Generator Lambda, daily EventBridge schedule,
  and the Flask dashboard EC2 instance.
  Dashboard source files are read from S3 at EC2 bootstrap time.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the CloudMart dashboard

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI

  LambdaS3Bucket:
    Type: String
    Description: Existing S3 bucket containing packaged Lambda code

  LambdaS3Key:
    Type: String
    Description: S3 key for the reporting Lambda package

  ReportsBucketName:
    Type: String
    Description: Existing S3 bucket used to store CloudMart reports

  DashboardS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the separate dashboard source files:
      app.py, index.html and login.html

  DashboardS3Prefix:
    Type: String
    Default: cloudmart-dashboard
    Description: >
      S3 prefix containing app.py, index.html and login.html.
      Do not include a leading or trailing slash.

  DbHostParameterName:
    Type: String
    Default: /cloudmart/dev/db/host
    Description: SSM parameter containing the RDS MySQL host

  DbPortParameterName:
    Type: String
    Default: /cloudmart/dev/db/port
    Description: SSM parameter containing the RDS MySQL port

  DbNameParameterName:
    Type: String
    Default: /cloudmart/dev/db/name
    Description: SSM parameter containing the database name

  DbUsernameParameterName:
    Type: String
    Default: /cloudmart/dev/db/username
    Description: SSM parameter containing the database username

  DbPasswordParameterName:
    Type: String
    Default: /cloudmart/dev/db/password
    Description: SSM SecureString parameter containing the database password

Resources:

  ReportGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/CloudMart-${Environment}-ReportGenerator
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  ReportGeneratorLambda:
    Type: AWS::Lambda::Function
    DependsOn:
      - ReportGeneratorLogGroup
    Properties:
      FunctionName: !Sub CloudMart-${Environment}-ReportGenerator
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Timeout: 60
      MemorySize: 256

      Role:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-ReportGeneratorLambdaRoleArn

      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetId
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          REPORTS_BUCKET: !Ref ReportsBucketName
          DB_HOST_PARAMETER: !Ref DbHostParameterName
          DB_PORT_PARAMETER: !Ref DbPortParameterName
          DB_NAME_PARAMETER: !Ref DbNameParameterName
          DB_USERNAME_PARAMETER: !Ref DbUsernameParameterName
          DB_PASSWORD_PARAMETER: !Ref DbPasswordParameterName

      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  DailyReportSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub CloudMart-${Environment}-DailyReport
      Description: !Sub Daily CloudMart report generation for ${Environment}

      # 03:00 UTC = 08:30 IST
      ScheduleExpression: cron(0 3 * * ? *)
      State: ENABLED

      Targets:
        - Arn: !GetAtt ReportGeneratorLambda.Arn
          Id: ReportGeneratorTarget
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3

        - Arn: !GetAtt ReportingEventBridgeLogGroup.Arn
          Id: ReportingEventBridgeLogTarget

  ReportingEventBridgeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/events/CloudMart-${Environment}-Reporting
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  ReportingEventBridgeLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub CloudMart-${Environment}-ReportingEventBridgeLogsPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub ${ReportingEventBridgeLogGroup.Arn}:*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ReportLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportGeneratorLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyReportSchedule.Arn

  DashboardEC2:
    Type: AWS::EC2::Instance
    Properties:

      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType

      IamInstanceProfile:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-DashboardInstanceProfileName

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId

      SecurityGroupIds:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId

      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Dashboard
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          exec > >(tee /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-dashboard-userdata -s 2>/dev/console) 2>&1

          echo "Starting CloudMart dashboard bootstrap..."

          export ENVIRONMENT='${Environment}'
          export AWS_REGION='${AWS::Region}'
          export REPORTS_BUCKET='${ReportsBucketName}'
          export SESSION_TIMEOUT_MINUTES='60'

          DASHBOARD_DIR="/opt/cloudmart-dashboard"

          mkdir -p "${DASHBOARD_DIR}"
          cd "${DASHBOARD_DIR}"

          echo "Installing system packages..."
          dnf install -y python3 python3-pip nginx

          echo "Downloading dashboard source files from S3..."

          aws s3 cp \
            "s3://${DashboardS3Bucket}/${DashboardS3Prefix}/app.py" \
            "${DASHBOARD_DIR}/app.py"

          aws s3 cp \
            "s3://${DashboardS3Bucket}/${DashboardS3Prefix}/index.html" \
            "${DASHBOARD_DIR}/index.html"

          aws s3 cp \
            "s3://${DashboardS3Bucket}/${DashboardS3Prefix}/login.html" \
            "${DASHBOARD_DIR}/login.html"

          echo "Dashboard source files downloaded."

          test -s "${DASHBOARD_DIR}/app.py"
          test -s "${DASHBOARD_DIR}/index.html"
          test -s "${DASHBOARD_DIR}/login.html"

          echo "Installing Python dependencies..."
          python3 -m pip install --upgrade pip
          python3 -m pip install Flask boto3 PyMySQL gunicorn

          echo "Creating systemd service..."

          cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICE
          [Unit]
          Description=CloudMart Flask Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/cloudmart-dashboard

          Environment="ENVIRONMENT=${Environment}"
          Environment="AWS_REGION=${AWS::Region}"
          Environment="REPORTS_BUCKET=${ReportsBucketName}"
          Environment="SESSION_TIMEOUT_MINUTES=60"

          ExecStart=/usr/local/bin/gunicorn \
            --workers 2 \
            --bind 127.0.0.1:5000 \
            --access-logfile - \
            --error-logfile - \
            app:app

          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICE

          echo "Creating Nginx configuration..."

          cat > /etc/nginx/conf.d/cloudmart-dashboard.conf <<'NGINX'
          server {
              listen 80;
              server_name _;

              client_max_body_size 10M;

              location / {
                  proxy_pass http://127.0.0.1:5000;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX

          echo "Validating Python application..."
          python3 -m py_compile "${DASHBOARD_DIR}/app.py"

          echo "Starting CloudMart dashboard..."
          systemctl daemon-reload
          systemctl enable cloudmart-dashboard
          systemctl restart cloudmart-dashboard

          sleep 5

          echo "Checking Flask dashboard health..."
          curl --fail --silent --show-error \
            http://127.0.0.1:5000/health

          echo
          echo "Validating Nginx configuration..."
          nginx -t

          systemctl enable nginx
          systemctl restart nginx

          echo "CloudMart dashboard deployed successfully."

  DashboardElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Dashboard-EIP
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  DashboardElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref DashboardEC2
      AllocationId: !GetAtt DashboardElasticIP.AllocationId

Outputs:

  ReportsBucketName:
    Description: Existing CloudMart reports S3 bucket
    Value: !Ref ReportsBucketName

  ReportLambdaName:
    Description: CloudMart Report Generator Lambda
    Value: !Ref ReportGeneratorLambda

  ReportLambdaArn:
    Description: CloudMart Report Generator Lambda ARN
    Value: !GetAtt ReportGeneratorLambda.Arn

  DailyReportRuleArn:
    Description: Daily report EventBridge rule ARN
    Value: !GetAtt DailyReportSchedule.Arn

  DashboardInstanceId:
    Description: CloudMart dashboard EC2 instance ID
    Value: !Ref DashboardEC2

  DashboardPublicIp:
    Description: CloudMart dashboard Elastic IP
    Value: !Ref DashboardElasticIP

  DashboardURL:
    Description: CloudMart dashboard URL
    Value: !Sub http://${DashboardElasticIP}

  DashboardSourceLocation:
    Description: S3 location used by the EC2 dashboard bootstrap
    Value: !Sub s3://${DashboardS3Bucket}/${DashboardS3Prefix}/
