AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Reporting Stack.
  Creates the Report Generator Lambda and its
  scheduled EventBridge trigger.
  Existing Network, Security and S3 resources are reused.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment

  InstanceType:
    Type: String
    Default: t3.micro

    Description:
      EC2 instance type for the CloudMart dashboard

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>

    Default:
      /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

    Description:
      Latest Amazon Linux 2023 AMI

  LambdaS3Bucket:
    Type: String

    Description:
      Existing S3 bucket containing packaged Lambda code

  LambdaS3Key:
    Type: String

    Description:
      S3 key for the reporting Lambda package

  ReportsBucketName:
    Type: String

    Description:
      Existing S3 bucket used to store CloudMart reports

  DbHostParameterName:
    Type: String

    Default: /cloudmart/dev/db/host

    Description:
      SSM parameter containing the RDS MySQL host

  DbPortParameterName:
    Type: String

    Default: /cloudmart/dev/db/port

    Description:
      SSM parameter containing the RDS MySQL port

  DbNameParameterName:
    Type: String

    Default: /cloudmart/dev/db/name

    Description:
      SSM parameter containing the database name

  DbUsernameParameterName:
    Type: String

    Default: /cloudmart/dev/db/username

    Description:
      SSM parameter containing the database username

  DbPasswordParameterName:
    Type: String

    Default: /cloudmart/dev/db/password

    Description:
      SSM SecureString parameter containing the database password


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ============================================================
  # REPORT GENERATOR LAMBDA
  # ============================================================

  ReportGeneratorLambda:
    Type: AWS::Lambda::Function

    DependsOn:
      - ReportGeneratorLogGroup

    Properties:

      FunctionName:
        !Sub CloudMart-${Environment}-ReportGenerator

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Timeout: 60

      MemorySize: 256


      # --------------------------------------------------------
      # EXISTING SECURITY STACK ROLE
      # --------------------------------------------------------

      Role:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-ReportGeneratorLambdaRoleArn


      # --------------------------------------------------------
      # LAMBDA CODE
      # --------------------------------------------------------

      Code:

        S3Bucket:
          !Ref LambdaS3Bucket

        S3Key:
          !Ref LambdaS3Key


      # --------------------------------------------------------
      # EXISTING NETWORK RESOURCES
      # --------------------------------------------------------

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetId

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId


      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          REPORTS_BUCKET:
            !Ref ReportsBucketName

          DB_HOST_PARAMETER:
            !Ref DbHostParameterName

          DB_PORT_PARAMETER:
            !Ref DbPortParameterName

          DB_NAME_PARAMETER:
            !Ref DbNameParameterName

          DB_USERNAME_PARAMETER:
            !Ref DbUsernameParameterName

          DB_PASSWORD_PARAMETER:
            !Ref DbPasswordParameterName


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # REPORT GENERATOR LAMBDA CLOUDWATCH LOG GROUP
  # ============================================================

  ReportGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        !Sub /aws/lambda/CloudMart-${Environment}-ReportGenerator
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # EVENTBRIDGE DAILY REPORT SCHEDULE
  # ============================================================

  DailyReportSchedule:
    Type: AWS::Events::Rule

    Properties:

      Name:
        !Sub CloudMart-${Environment}-DailyReport

      Description:
        !Sub Daily CloudMart report generation for ${Environment}


      # --------------------------------------------------------
      # 03:00 UTC = 08:30 IST
      # --------------------------------------------------------

      ScheduleExpression:
        cron(0 3 * * ? *)

      State: ENABLED

      Targets:

        # --------------------------------------------------------
        # TARGET 1 - REPORT GENERATOR LAMBDA
        # --------------------------------------------------------

        - Arn:
            !GetAtt ReportGeneratorLambda.Arn

          Id:
            ReportGeneratorTarget

          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 3

        # --------------------------------------------------------
        # TARGET 2 - CLOUDWATCH LOGS
        # --------------------------------------------------------

        - Arn:
            !GetAtt ReportingEventBridgeLogGroup.Arn

          Id:
            ReportingEventBridgeLogTarget


  # ============================================================
  # EVENTBRIDGE CLOUDWATCH LOG GROUP
  # ============================================================

  ReportingEventBridgeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        !Sub /aws/events/CloudMart-${Environment}-Reporting
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # ALLOW EVENTBRIDGE TO WRITE TO CLOUDWATCH LOGS
  # ============================================================

  ReportingEventBridgeLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName:
        !Sub CloudMart-${Environment}-ReportingEventBridgeLogsPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              !Sub ${ReportingEventBridgeLogGroup.Arn}:*
            Condition:
              StringEquals:
                aws:SourceAccount:
                  !Ref AWS::AccountId


  # ============================================================
  # ALLOW EVENTBRIDGE TO INVOKE REPORT LAMBDA
  # ============================================================

  ReportLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName:
        !Ref ReportGeneratorLambda

      Action:
        lambda:InvokeFunction

      Principal:
        events.amazonaws.com

      SourceArn:
        !GetAtt DailyReportSchedule.Arn


  # ============================================================
  # EC2 FLASK DASHBOARD
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:

      # --------------------------------------------------------
      # AMAZON LINUX 2023
      # --------------------------------------------------------

      ImageId:
        !Ref LatestAmiId


      # --------------------------------------------------------
      # INSTANCE SIZE
      # --------------------------------------------------------

      InstanceType:
        !Ref InstanceType


      # --------------------------------------------------------
      # EXISTING SECURITY STACK INSTANCE PROFILE
      # --------------------------------------------------------

      IamInstanceProfile:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-DashboardInstanceProfileName


      # --------------------------------------------------------
      # EXISTING NETWORK PUBLIC SUBNET
      # --------------------------------------------------------

      SubnetId:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-PublicSubnetId


      # --------------------------------------------------------
      # EXISTING EC2 DASHBOARD SECURITY GROUP
      # --------------------------------------------------------

      SecurityGroupIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-EC2SecurityGroupId


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub CloudMart-${Environment}-Dashboard

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value:
            !Ref Environment


