  # ============================================================
  # DASHBOARD ELASTIC IP
  # ============================================================

  DashboardElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub CloudMart-${Environment}-Dashboard-EIP
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # ============================================================
  # ASSOCIATE ELASTIC IP WITH DASHBOARD EC2
  # ============================================================

  DashboardElasticIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId:
        !Ref DashboardEC2
      AllocationId:
        !GetAtt DashboardElasticIP.AllocationId


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ============================================================
  # EXISTING REPORTS BUCKET
  # ============================================================

  ReportsBucketName:

    Description:
      Existing CloudMart reports S3 bucket

    Value:
      !Ref ReportsBucketName


  # ============================================================
  # REPORT LAMBDA
  # ============================================================

  ReportLambdaName:

    Description:
      CloudMart Report Generator Lambda

    Value:
      !Ref ReportGeneratorLambda


  ReportLambdaArn:

    Description:
      CloudMart Report Generator Lambda ARN

    Value:
      !GetAtt ReportGeneratorLambda.Arn


  # ============================================================
  # DAILY REPORT EVENTBRIDGE RULE
  # ============================================================

  DailyReportRuleArn:

    Description:
      Daily report EventBridge rule ARN

    Value:
      !GetAtt DailyReportSchedule.Arn


  # ============================================================
  # DASHBOARD INSTANCE
  # ============================================================

  DashboardInstanceId:

    Description:
      CloudMart dashboard EC2 instance ID

    Value:
      !Ref DashboardEC2


  DashboardPublicIp:

    Description:
      CloudMart dashboard Elastic IP

    Value:
      !Ref DashboardElasticIP


  DashboardURL:

    Description:
      CloudMart dashboard URL

    Value:
      !Sub
        http://${DashboardElasticIP}