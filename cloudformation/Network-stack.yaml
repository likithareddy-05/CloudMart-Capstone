AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network Stack.
  Creates VPC, public and private subnets,
  Internet Gateway, route tables, security groups,
  and VPC interface endpoints for SSM and CloudWatch Logs.

# =========================================================
# PARAMETERS
# =========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


# =========================================================
# RESOURCES
# =========================================================

Resources:

  # =======================================================
  # VPC
  # =======================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC

    Properties:

      CidrBlock: 10.0.0.0/16

      EnableDnsSupport: true

      EnableDnsHostnames: true

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # INTERNET GATEWAY
  # =======================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw

        - Key: Environment
          Value: !Ref Environment


  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:

      VpcId:
        !Ref CloudMartVPC

      InternetGatewayId:
        !Ref InternetGateway


  # =======================================================
  # PUBLIC SUBNET
  # =======================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:

      VpcId:
        !Ref CloudMartVPC

      CidrBlock: 10.0.0.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ''

      MapPublicIpOnLaunch: true

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # PRIMARY PRIVATE SUBNET
  # =======================================================

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:

      VpcId:
        !Ref CloudMartVPC

      CidrBlock: 10.0.1.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ''

      MapPublicIpOnLaunch: false

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # RDS SUPPORT PRIVATE SUBNET
  # =======================================================
  #
  # Required because an RDS DB subnet group must contain
  # subnets in at least two Availability Zones.
  #
  # This does NOT make the RDS instance Multi-AZ.
  # =======================================================

  RdsSupportPrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:

      VpcId:
        !Ref CloudMartVPC

      CidrBlock: 10.0.2.0/24

      AvailabilityZone:
        !Select
          - 1
          - !GetAZs ''

      MapPublicIpOnLaunch: false

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-support-private-subnet

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # PUBLIC ROUTE TABLE
  # =======================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:

      VpcId:
        !Ref CloudMartVPC

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-rt

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # PUBLIC DEFAULT ROUTE
  # =======================================================

  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - VPCGatewayAttachment

    Properties:

      RouteTableId:
        !Ref PublicRouteTable

      DestinationCidrBlock: 0.0.0.0/0

      GatewayId:
        !Ref InternetGateway


  # =======================================================
  # PUBLIC SUBNET ASSOCIATION
  # =======================================================

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      SubnetId:
        !Ref PublicSubnet

      RouteTableId:
        !Ref PublicRouteTable


  # =======================================================
  # PRIVATE ROUTE TABLE
  # =======================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:

      VpcId:
        !Ref CloudMartVPC

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-rt

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # PRIVATE SUBNET ASSOCIATION
  # =======================================================

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      SubnetId:
        !Ref PrivateSubnet

      RouteTableId:
        !Ref PrivateRouteTable


  # =======================================================
  # RDS SUPPORT SUBNET ASSOCIATION
  # =======================================================

  RdsSupportPrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      SubnetId:
        !Ref RdsSupportPrivateSubnet

      RouteTableId:
        !Ref PrivateRouteTable


  # =======================================================
  # LAMBDA SECURITY GROUP
  # =======================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow CloudMart Lambda functions to communicate
        with AWS services and RDS.

      VpcId:
        !Ref CloudMartVPC

      SecurityGroupEgress:

        # HTTPS access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # RDS SECURITY GROUP
  # =======================================================

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow MySQL access from CloudMart Lambda functions.

      VpcId:
        !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId:
            !Ref LambdaSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # VPC ENDPOINT SECURITY GROUP
  # =======================================================

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow HTTPS access from Lambda to VPC endpoints.

      VpcId:
        !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId:
            !Ref LambdaSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc-endpoint-sg

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # SSM VPC INTERFACE ENDPOINT
  # =======================================================

  SsmVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:

        - !Ref PrivateSubnet

        - !Ref RdsSupportPrivateSubnet

      SecurityGroupIds:

        - !Ref VpcEndpointSecurityGroup


  # =======================================================
  # CLOUDWATCH LOGS VPC INTERFACE ENDPOINT
  # =======================================================

  CloudWatchLogsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.logs

      PrivateDnsEnabled: true

      SubnetIds:

        - !Ref PrivateSubnet

        - !Ref RdsSupportPrivateSubnet

      SecurityGroupIds:

        - !Ref VpcEndpointSecurityGroup


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  # =======================================================
  # VPC
  # =======================================================

  VpcId:

    Description:
      CloudMart VPC ID

    Value:
      !Ref CloudMartVPC

    Export:
      Name:
        !Sub CloudMart-${Environment}-VpcId


  # =======================================================
  # PUBLIC SUBNET
  # =======================================================

  PublicSubnetId:

    Description:
      CloudMart public subnet ID

    Value:
      !Ref PublicSubnet

    Export:
      Name:
        !Sub CloudMart-${Environment}-PublicSubnetId


  # =======================================================
  # PRIMARY PRIVATE SUBNET
  # =======================================================

  PrivateSubnetId:

    Description:
      CloudMart private subnet ID

    Value:
      !Ref PrivateSubnet

    Export:
      Name:
        !Sub CloudMart-${Environment}-PrivateSubnetId


  # =======================================================
  # RDS SUPPORT PRIVATE SUBNET
  # =======================================================

  RdsSupportPrivateSubnetId:

    Description:
      CloudMart RDS support private subnet ID

    Value:
      !Ref RdsSupportPrivateSubnet

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsSupportPrivateSubnetId


  # =======================================================
  # LAMBDA SECURITY GROUP
  # =======================================================

  LambdaSecurityGroup:

    Description:
      Security group used by CloudMart Lambda functions

    Value:
      !Ref LambdaSecurityGroup

    Export:
      Name:
        !Sub CloudMart-${Environment}-LambdaSecurityGroupId


  # =======================================================
  # RDS SECURITY GROUP
  # =======================================================

  RdsSecurityGroup:

    Description:
      Security group used by CloudMart RDS MySQL

    Value:
      !Ref RdsSecurityGroup

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsSecurityGroupId


  # =======================================================
  # VPC ENDPOINT SECURITY GROUP
  # =======================================================

  VpcEndpointSecurityGroup:

    Description:
      Security group used by CloudMart interface VPC endpoints

    Value:
      !Ref VpcEndpointSecurityGroup

    Export:
      Name:
        !Sub CloudMart-${Environment}-VpcEndpointSecurityGroupId


  # =======================================================
  # SSM ENDPOINT
  # =======================================================

  SsmVpcEndpointId:

    Description:
      SSM Parameter Store VPC interface endpoint

    Value:
      !Ref SsmVpcEndpoint

    Export:
      Name:
        !Sub CloudMart-${Environment}-SsmVpcEndpointId


  # =======================================================
  # CLOUDWATCH LOGS ENDPOINT
  # =======================================================

  CloudWatchLogsVpcEndpointId:

    Description:
      CloudWatch Logs VPC interface endpoint

    Value:
      !Ref CloudWatchLogsVpcEndpoint

    Export:
      Name:
        !Sub CloudMart-${Environment}-CloudWatchLogsVpcEndpointId