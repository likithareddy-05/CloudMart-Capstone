AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Network Stack.
  Creates the VPC, public and private subnets,
  Internet Gateway, route tables, security groups,
  and VPC interface endpoints required by
  Lambda, SSM Parameter Store, and CloudWatch Logs.

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


Resources:

  # =========================================================
  # VPC
  # =========================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC

    Properties:
      CidrBlock: 10.0.0.0/16

      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc


  # =========================================================
  # INTERNET GATEWAY
  # =========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw


  # Attach Internet Gateway to VPC

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # =========================================================
  # PUBLIC SUBNET
  # =========================================================

  # Single Availability Zone design

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC

      CidrBlock: 10.0.1.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ''

      MapPublicIpOnLaunch: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet


  # =========================================================
  # PRIVATE SUBNET
  # =========================================================

  # Single Availability Zone design

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC

      CidrBlock: 10.0.2.0/24

      AvailabilityZone:
        !Select
          - 0
          - !GetAZs ''

      MapPublicIpOnLaunch: false

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet


  # =========================================================
  # PUBLIC ROUTE TABLE
  # =========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-rt


  # Internet route for public subnet

  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn:
      - AttachInternetGateway

    Properties:
      RouteTableId:
        !Ref PublicRouteTable

      DestinationCidrBlock:
        0.0.0.0/0

      GatewayId:
        !Ref InternetGateway


  # Associate public subnet with public route table

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId:
        !Ref PublicSubnet

      RouteTableId:
        !Ref PublicRouteTable


  # =========================================================
  # PRIVATE ROUTE TABLE
  # =========================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-rt


  # Associate private subnet with private route table

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      SubnetId:
        !Ref PrivateSubnet

      RouteTableId:
        !Ref PrivateRouteTable


  # =========================================================
  # LAMBDA SECURITY GROUP
  # =========================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow Lambda functions to communicate with
        RDS and AWS VPC interface endpoints.

      VpcId:
        !Ref CloudMartVPC

      SecurityGroupEgress:

        # HTTPS access to AWS services
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg


  # =========================================================
  # VPC ENDPOINT SECURITY GROUP
  # =========================================================

  # Separate security group for interface endpoints.
  #
  # Lambda SG -> TCP 443 -> VPC Endpoint SG
  #
  # This is required for SSM and CloudWatch Logs
  # interface endpoints.

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow HTTPS traffic from Lambda functions
        to VPC interface endpoints.

      VpcId:
        !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId:
            !Ref LambdaSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpce-sg


  # =========================================================
  # RDS SECURITY GROUP
  # =========================================================

  # Only Lambda functions using LambdaSecurityGroup
  # can connect to MySQL on port 3306.

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow MySQL access only from Lambda security group.

      VpcId:
        !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId:
            !Ref LambdaSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg


  # =========================================================
  # SSM VPC INTERFACE ENDPOINT
  # =========================================================

  # Allows private Lambda functions to access
  # Systems Manager Parameter Store without
  # requiring public internet access.

  SsmVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref CloudMartVPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.ssm

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ssm-endpoint


  # =========================================================
  # CLOUDWATCH LOGS VPC INTERFACE ENDPOINT
  # =========================================================

  # Allows Lambda functions inside the private subnet
  # to send logs to CloudWatch Logs.

  CloudWatchLogsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref CloudMartVPC

      ServiceName:
        !Sub com.amazonaws.${AWS::Region}.logs

      VpcEndpointType: Interface

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet

      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-logs-endpoint


# ===========================================================
# OUTPUTS
# ===========================================================

Outputs:


  # =========================================================
  # VPC ID
  # =========================================================

  VpcId:
    Description:
      CloudMart VPC ID

    Value:
      !Ref CloudMartVPC

    Export:
      Name:
        !Sub CloudMart-${Environment}-VpcId


  # =========================================================
  # PUBLIC SUBNET ID
  # =========================================================

  PublicSubnetId:
    Description:
      CloudMart public subnet ID

    Value:
      !Ref PublicSubnet

    Export:
      Name:
        !Sub CloudMart-${Environment}-PublicSubnetId


  # =========================================================
  # PRIVATE SUBNET ID
  # =========================================================

  PrivateSubnetId:
    Description:
      CloudMart private subnet ID

    Value:
      !Ref PrivateSubnet

    Export:
      Name:
        !Sub CloudMart-${Environment}-PrivateSubnetId


  # =========================================================
  # LAMBDA SECURITY GROUP ID
  # =========================================================

  LambdaSecurityGroupId:
    Description:
      Security group used by CloudMart Lambda functions

    Value:
      !Ref LambdaSecurityGroup

    Export:
      Name:
        !Sub CloudMart-${Environment}-LambdaSecurityGroupId


  # =========================================================
  # RDS SECURITY GROUP ID
  # =========================================================

  RdsSecurityGroupId:
    Description:
      Security group used by CloudMart RDS MySQL

    Value:
      !Ref RdsSecurityGroup

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsSecurityGroupId


  # =========================================================
  # VPC ENDPOINT SECURITY GROUP ID
  # =========================================================

  VpcEndpointSecurityGroupId:
    Description:
      Security group used by CloudMart interface VPC endpoints

    Value:
      !Ref VpcEndpointSecurityGroup

    Export:
      Name:
        !Sub CloudMart-${Environment}-VpcEndpointSecurityGroupId


  # =========================================================
  # SSM VPC ENDPOINT ID
  # =========================================================

  SsmVpcEndpointId:
    Description:
      SSM Parameter Store VPC interface endpoint

    Value:
      !Ref SsmVpcEndpoint

    Export:
      Name:
        !Sub CloudMart-${Environment}-SsmVpcEndpointId


  # =========================================================
  # CLOUDWATCH LOGS VPC ENDPOINT ID
  # =========================================================

  CloudWatchLogsVpcEndpointId:
    Description:
      CloudWatch Logs VPC interface endpoint

    Value:
      !Ref CloudWatchLogsVpcEndpoint

    Export:
      Name:
        !Sub CloudMart-${Environment}-CloudWatchLogsVpcEndpointId