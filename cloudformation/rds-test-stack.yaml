AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart RDS connectivity test Lambda.
  This temporary Lambda runs inside the CloudMart VPC
  and verifies connectivity to the private RDS MySQL instance.

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod


Resources:

  # =========================================================
  # IAM ROLE
  # =========================================================

  RdsTestLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub CloudMart-${Environment}-RdsTestLambdaRole

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName:
            !Sub CloudMart-${Environment}-RdsTestSSMAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Sid: ReadDatabaseParameters

                Effect: Allow

                Action:

                  - ssm:GetParameter

                Resource:

                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*


  # =========================================================
  # LAMBDA FUNCTION
  # =========================================================

  RdsTestLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-${Environment}-rds-test

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role:
        !GetAtt RdsTestLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetId

        SecurityGroupIds:

          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Code:

        S3Bucket:
          Fn::ImportValue:
            !Sub CloudMart-${Environment}-LambdaBucketName

        S3Key:
          !Sub rds-test/${AWS::StackName}/lambda.zip


Outputs:

  RdsTestLambdaArn:

    Description:
      RDS connectivity test Lambda ARN

    Value:
      !GetAtt RdsTestLambda.Arn

    Export:

      Name:
        !Sub CloudMart-${Environment}-RdsTestLambdaArn

  RdsTestLambdaRoleArn:

    Description:
      RDS connectivity test Lambda IAM role ARN

    Value:
      !GetAtt RdsTestLambdaRole.Arn