AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data Stack.
  Creates the RDS MySQL database and S3 bucket.
  RDS is deployed as Single-AZ. A second private subnet
  is used only because AWS requires an RDS DB subnet group
  to span at least two Availability Zones.

# =========================================================
# PARAMETERS
# =========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


  DBName:
    Type: String
    Default: cloudmart

    Description: CloudMart MySQL database name


  DBUsername:
    Type: String
    Default: cloudmartadmin

    Description: RDS master username


  DBPassword:
    Type: String
    NoEcho: true

    MinLength: 8
    MaxLength: 41

    Description: >
      RDS master password supplied securely through
      the GitHub Actions deployment workflow.


# =========================================================
# RESOURCES
# =========================================================

Resources:


  # =======================================================
  # RDS DB SUBNET GROUP
  # =======================================================
  #
  # AWS requires an RDS DB subnet group to contain
  # subnets in at least two Availability Zones.
  #
  # This does NOT make the RDS instance Multi-AZ.
  #
  # The actual RDS instance remains Single-AZ
  # because MultiAZ is set to false below.
  # =======================================================

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription:
        CloudMart RDS MySQL private subnet group

      SubnetIds:

        # -------------------------------------------------
        # Primary private subnet
        # -------------------------------------------------

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnetId

        # -------------------------------------------------
        # Second private subnet in another AZ.
        # Used only to satisfy the RDS subnet group
        # requirement.
        # -------------------------------------------------

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSupportPrivateSubnetId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # RDS MYSQL DATABASE
  # =======================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    # -----------------------------------------------------
    # If the stack is deleted, CloudFormation attempts
    # to create a final snapshot.
    # -----------------------------------------------------

    DeletionPolicy: Snapshot

    UpdateReplacePolicy: Snapshot

    Properties:


      # ===================================================
      # DATABASE ENGINE
      # ===================================================

      Engine: mysql

      EngineVersion: '8.0'


      # ===================================================
      # INSTANCE CLASS
      # ===================================================

      # Free Tier-compatible small instance for the
      # CloudMart development environment.

      DBInstanceClass: db.t3.micro


      # ===================================================
      # DATABASE CONFIGURATION
      # ===================================================

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref DBUsername

      MasterUserPassword:
        !Ref DBPassword

      Port: 3306


      # ===================================================
      # STORAGE
      # ===================================================

      AllocatedStorage: 20

      StorageType: gp3


      # ===================================================
      # STORAGE ENCRYPTION
      # ===================================================
      #
      # Disabled for the current Free Tier configuration.
      # ===================================================

      StorageEncrypted: false


      # ===================================================
      # NETWORKING
      # ===================================================

      DBSubnetGroupName:
        !Ref RdsSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSecurityGroupId

      # RDS must remain private.
      # It must not receive a public IP address.

      PubliclyAccessible: false


      # ===================================================
      # SINGLE-AZ DEPLOYMENT
      # ===================================================
      #
      # The RDS instance itself is Single-AZ.
      #
      # The second subnet exists only because the
      # DB subnet group requires subnets in multiple AZs.
      # ===================================================

      MultiAZ: false


      # ===================================================
      # AUTOMATED BACKUP RETENTION
      # ===================================================
      #
      # Free Tier project configuration.
      # ===================================================

      BackupRetentionPeriod: 7


      # ===================================================
      # MAINTENANCE
      # ===================================================

      AutoMinorVersionUpgrade: true


      # ===================================================
      # CLOUDWATCH LOG EXPORTS
      # ===================================================

      EnableCloudwatchLogsExports:

        - error
        - general
        - slowquery


      # ===================================================
      # TAGS
      # ===================================================

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # S3 PRODUCT BUCKET
  # =======================================================

  CloudMartProductBucket:
    Type: AWS::S3::Bucket

    # Keep the bucket if the CloudFormation stack is deleted.

    DeletionPolicy: Retain

    UpdateReplacePolicy: Retain

    Properties:


      # ===================================================
      # SERVER-SIDE ENCRYPTION
      # ===================================================

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256


      # ===================================================
      # BLOCK PUBLIC ACCESS
      # ===================================================

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true


      # ===================================================
      # VERSIONING
      # ===================================================

      VersioningConfiguration:

        Status: Enabled


      # ===================================================
      # TAGS
      # ===================================================

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-bucket

        - Key: Environment
          Value: !Ref Environment


# =========================================================
# OUTPUTS
# =========================================================

Outputs:


  # =======================================================
  # RDS INSTANCE IDENTIFIER
  # =======================================================

  RdsInstanceIdentifier:

    Description:
      CloudMart RDS MySQL instance identifier

    Value:
      !Ref CloudMartDatabase

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsInstanceIdentifier


  # =======================================================
  # RDS ENDPOINT
  # =======================================================

  RdsEndpoint:

    Description:
      CloudMart RDS MySQL endpoint

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Address

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsEndpoint


  # =======================================================
  # RDS PORT
  # =======================================================

  RdsPort:

    Description:
      CloudMart RDS MySQL port

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Port

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsPort


  # =======================================================
  # DATABASE NAME
  # =======================================================

  RdsDatabaseName:

    Description:
      CloudMart MySQL database name

    Value:
      !Ref DBName

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsDatabaseName


  # =======================================================
  # DATABASE USERNAME
  # =======================================================

  RdsUsername:

    Description:
      CloudMart RDS master username

    Value:
      !Ref DBUsername

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsUsername


  # =======================================================
  # S3 PRODUCT BUCKET
  # =======================================================

  ProductBucketName:

    Description:
      CloudMart product S3 bucket name

    Value:
      !Ref CloudMartProductBucket

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductBucketName