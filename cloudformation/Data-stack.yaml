AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Data Stack

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

  DBName:
    Type: String
    Default: cloudmart

  DBUsername:
    Type: String
    Default: cloudmartadmin

  DBPassword:
    Type: String
    NoEcho: true

Resources:

  # =======================================================
  # RDS SUBNET GROUP
  # =======================================================

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:
      DBSubnetGroupDescription: CloudMart DB Subnet Group

      SubnetIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSupportPrivateSubnetId

  # =======================================================
  # RDS DATABASE
  # =======================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    Properties:

      DBInstanceIdentifier: !Sub cloudmart-${Environment}-db

      Engine: mysql

      # Recommended to remove EngineVersion
      # unless you know the exact supported version
      # EngineVersion: "8.0"

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20

      StorageType: gp3

      MultiAZ: false

      PubliclyAccessible: false

      StorageEncrypted: true

      DBName: !Ref DBName

      MasterUsername: !Ref DBUsername

      MasterUserPassword: !Ref DBPassword

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSecurityGroupId

      DBSubnetGroupName:
        !Ref RdsSubnetGroup

      DeletionProtection: false

      BackupRetentionPeriod: 0

  # =======================================================
  # DYNAMODB
  # =======================================================

  OrdersTable:
    Type: AWS::DynamoDB::Table

    Properties:

      TableName:
        !Sub CloudMartOrders-${Environment}

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: OrderId
          AttributeType: S

        - AttributeName: CustomerId
          AttributeType: S

      KeySchema:

        - AttributeName: OrderId
          KeyType: HASH

      GlobalSecondaryIndexes:

        - IndexName: CustomerIndex

          KeySchema:

            - AttributeName: CustomerId
              KeyType: HASH

          Projection:
            ProjectionType: ALL

  # =======================================================
  # LAMBDA ARTIFACTS BUCKET
  # =======================================================

  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-lambda-${AWS::AccountId}

  # =======================================================
  # REPORTS BUCKET
  # =======================================================

  ReportsBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-reports-${AWS::AccountId}

Outputs:

  RdsEndpoint:

    Description: CloudMart RDS Endpoint

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Address

  DynamoDBTable:

    Description: Orders DynamoDB Table

    Value:
      !Ref OrdersTable

  LambdaBucket:

    Description: Lambda Artifacts Bucket

    Value:
      !Ref LambdaArtifactsBucket

  ReportsBucketName:

    Description: Reports Bucket

    Value:
      !Ref ReportsBucket