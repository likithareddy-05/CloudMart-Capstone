AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Data Stack

# =========================================================
# PARAMETERS
# =========================================================
# Provide persistent data storage and object storage for CloudMart.

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod


  # -------------------------------------------------------
  # DATABASE NAME
  # -------------------------------------------------------
  # Lambda later uses this database name to connect to MySQL.

  DBName:
    Type: String
    Default: cloudmart


  # -------------------------------------------------------
  # DATABASE USERNAME
  # -------------------------------------------------------

  DBUsername:
    Type: String
    Default: cloudmartadmin


  # -------------------------------------------------------
  # ORDER NOTIFICATION EMAIL
  # -------------------------------------------------------
  # The actual email value will come from a GitHub Secret
  # through the deployment workflow.

  OrderEmail:
    Type: String
    NoEcho: true


  # -------------------------------------------------------
  # LOW-STOCK NOTIFICATION EMAIL
  # -------------------------------------------------------
  # The actual email value will come from a GitHub Secret
  # through the deployment workflow.

  LowStockEmail:
    Type: String
    NoEcho: true


# =========================================================
# RESOURCES
# =========================================================

Resources:


  # =======================================================
  # RDS SUBNET GROUP
  # =======================================================
  #
  # Uses two private subnets in different Availability
  # Zones because an RDS DB subnet group requires
  # subnets in at least two AZs.
  #
  # This does NOT make the RDS instance Multi-AZ.
  # The database itself remains Single-AZ.
  # =======================================================

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    # These are the subnets where my database is allowed
    # to be placed.
    Properties:

      DBSubnetGroupDescription:
        CloudMart DB Subnet Group

      # RDS DB subnet group requires subnets in at least
      # two AZs.
      SubnetIds:

        # Primary private subnet
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnetId

        # Second private subnet in another AZ
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSupportPrivateSubnetId


  # =======================================================
  # RDS MYSQL DATABASE
  # =======================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    Properties:

      # ---------------------------------------------------
      # RDS INSTANCE IDENTIFIER
      # ---------------------------------------------------

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-db


      # ---------------------------------------------------
      # DATABASE ENGINE
      # ---------------------------------------------------

      Engine: mysql


      # ---------------------------------------------------
      # INSTANCE CLASS
      # ---------------------------------------------------

      DBInstanceClass: db.t3.micro


      # ---------------------------------------------------
      # STORAGE
      # ---------------------------------------------------

      AllocatedStorage: 20

      StorageType: gp3

      # gp3 is EBS-backed general-purpose SSD storage
      # type used by RDS.


      # ---------------------------------------------------
      # SINGLE-AZ
      # ---------------------------------------------------

      MultiAZ: false


      # ---------------------------------------------------
      # PRIVATE DATABASE
      # ---------------------------------------------------

      PubliclyAccessible: false


      # ---------------------------------------------------
      # STORAGE ENCRYPTION
      # ---------------------------------------------------

      StorageEncrypted: true


      # ---------------------------------------------------
      # DATABASE NAME
      # ---------------------------------------------------

      DBName:
        !Ref DBName


      # ---------------------------------------------------
      # MASTER USER
      # ---------------------------------------------------

      MasterUsername:
        !Ref DBUsername


      # ---------------------------------------------------
      # MASTER PASSWORD
      # ---------------------------------------------------
      #
      # Password is created in SSM by GitHub Actions
      # before this Data Stack is deployed.
      #
      # SSM parameter:
      # /cloudmart/${Environment}/db/password
      #

      MasterUserPassword:
        !Sub '{{resolve:ssm-secure:/cloudmart/${Environment}/db/password}}'


      # ---------------------------------------------------
      # MYSQL PORT
      # ---------------------------------------------------

      Port: 3306


      # ---------------------------------------------------
      # RDS SECURITY GROUP
      # ---------------------------------------------------

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSecurityGroupId

      # Data Stack imports that security group ID and
      # attaches it to RDS.
      # It is a cross-stack dependency.


      # ---------------------------------------------------
      # RDS SUBNET GROUP
      # ---------------------------------------------------

      DBSubnetGroupName:
        !Ref RdsSubnetGroup


      # ---------------------------------------------------
      # DELETION PROTECTION
      # ---------------------------------------------------

      DeletionProtection: false


      # ---------------------------------------------------
      # AUTOMATED BACKUP
      # ---------------------------------------------------
      #
      # BackupRetentionPeriod = 0 because your AWS account
      # is using the Free Tier configuration.
      # ---------------------------------------------------

      BackupRetentionPeriod: 0


  # =======================================================
  # DATABASE SSM PARAMETERS
  # =======================================================


  # -------------------------------------------------------
  # DATABASE HOST
  # -------------------------------------------------------

  DbHostParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/host

      Type: String

      Value:
        !GetAtt CloudMartDatabase.Endpoint.Address

      Description:
        CloudMart RDS MySQL host


  # -------------------------------------------------------
  # DATABASE PORT
  # -------------------------------------------------------

  DbPortParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/port

      Type: String

      Value:
        !GetAtt CloudMartDatabase.Endpoint.Port

      Description:
        CloudMart RDS MySQL port


  # -------------------------------------------------------
  # DATABASE NAME
  # -------------------------------------------------------

  DbNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/name

      Type: String

      Value:
        !Ref DBName

      Description:
        CloudMart database name


  # -------------------------------------------------------
  # DATABASE USERNAME
  # -------------------------------------------------------

  DbUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/db/username

      Type: String

      Value:
        !Ref DBUsername

      Description:
        CloudMart database username


  # =======================================================
  # NOTIFICATION EMAIL SSM PARAMETERS
  # =======================================================


  # -------------------------------------------------------
  # ORDER NOTIFICATION EMAIL
  # -------------------------------------------------------

  OrderEmailParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/notifications/order-email

      Type: String

      Value:
        !Ref OrderEmail

      Description:
        CloudMart order notification email


  # -------------------------------------------------------
  # LOW-STOCK NOTIFICATION EMAIL
  # -------------------------------------------------------

  LowStockEmailParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${Environment}/notifications/low-stock-email

      Type: String

      Value:
        !Ref LowStockEmail

      Description:
        CloudMart low-stock notification email


  # =======================================================
  # LAMBDA ARTIFACTS S3 BUCKET
  # =======================================================
  #
  # Stores Lambda deployment packages.
  # =======================================================

  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-lambda-${AWS::AccountId}

      # It stores your Lambda deployment ZIP packages.


  # =======================================================
  # REPORTS S3 BUCKET
  # =======================================================

  ReportsBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName:
        !Sub cloudmart-${Environment}-reports-${AWS::AccountId}

      # Storage location for CloudMart reports.


# =========================================================
# OUTPUTS
# =========================================================

Outputs:


  # =======================================================
  # RDS ENDPOINT
  # =======================================================

  RdsEndpoint:

    Description:
      CloudMart RDS MySQL Endpoint

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Address


  # =======================================================
  # RDS PORT
  # =======================================================

  RdsPort:

    Description:
      CloudMart RDS MySQL Port

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Port


  # =======================================================
  # DATABASE NAME
  # =======================================================

  RdsDatabaseName:

    Description:
      CloudMart Database Name

    Value:
      !Ref DBName


  # =======================================================
  # DATABASE USERNAME
  # =======================================================

  RdsUsername:

    Description:
      CloudMart RDS Username

    Value:
      !Ref DBUsername


  # =======================================================
  # LAMBDA ARTIFACTS S3 BUCKET
  # =======================================================

  LambdaBucket:

    Description:
      CloudMart Lambda Artifacts Bucket

    Value:
      !Ref LambdaArtifactsBucket

    Export:
      Name:
        !Sub CloudMart-${Environment}-LambdaBucket


  # =======================================================
  # REPORTS S3 BUCKET
  # =======================================================

  ReportsBucketName:

    Description:
      CloudMart Reports Bucket

    Value:
      !Ref ReportsBucket