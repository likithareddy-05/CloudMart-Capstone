AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data Stack.
  Creates the RDS MySQL database and S3 bucket.
  RDS is deployed as Single-AZ. A second private subnet
  is used only because AWS requires an RDS DB subnet group
  to span at least two Availability Zones.

# =========================================================
# PARAMETERS
# =========================================================

Parameters:

  Environment:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - test
      - prod

    Description: Deployment environment


  DBName:
    Type: String
    Default: cloudmart

    Description: CloudMart MySQL database name


  DBUsername:
    Type: String
    Default: cloudmartadmin

    Description: RDS master username


  DBPassword:
    Type: String
    NoEcho: true

    MinLength: 8
    MaxLength: 41

    Description: >
      RDS master password. Supplied securely by the
      GitHub Actions deployment workflow.


# =========================================================
# RESOURCES
# =========================================================

Resources:


  # =======================================================
  # RDS DB SUBNET GROUP
  # =======================================================
  #
  # IMPORTANT:
  # AWS requires an RDS DB subnet group to contain
  # subnets in at least two Availability Zones.
  #
  # This does NOT make the RDS instance Multi-AZ.
  # The RDS instance below uses MultiAZ: false.
  #
  # The second subnet exists only for this AWS requirement.
  # =======================================================

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription:
        CloudMart RDS MySQL private subnet group

      SubnetIds:

        # Primary private subnet
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnetId

        # RDS supporting subnet in second AZ
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSupportPrivateSubnetId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # RDS MYSQL
  # =======================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      # ---------------------------------------------------
      # Engine
      # ---------------------------------------------------

      Engine: mysql

      EngineVersion: '8.0'

      DBInstanceClass: db.t3.micro


      # ---------------------------------------------------
      # Database
      # ---------------------------------------------------

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref DBUsername

      MasterUserPassword:
        !Ref DBPassword

      Port: 3306


      # ---------------------------------------------------
      # Storage
      # ---------------------------------------------------

      AllocatedStorage: 20

      StorageType: gp3

      StorageEncrypted: true


      # ---------------------------------------------------
      # Networking
      # ---------------------------------------------------

      DBSubnetGroupName:
        !Ref RdsSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSecurityGroupId

      PubliclyAccessible: false


      # ---------------------------------------------------
      # SINGLE-AZ
      # ---------------------------------------------------
      #
      # The database itself is NOT Multi-AZ.
      # The second subnet exists only for the DB subnet
      # group requirement.
      # ---------------------------------------------------

      MultiAZ: false


      # ---------------------------------------------------
      # Backup
      # ---------------------------------------------------

      BackupRetentionPeriod: 0


      # ---------------------------------------------------
      # Maintenance
      # ---------------------------------------------------

      AutoMinorVersionUpgrade: true


      # ---------------------------------------------------
      # CloudWatch Logs
      # ---------------------------------------------------

      EnableCloudwatchLogsExports:

        - error
        - general
        - slowquery


      # ---------------------------------------------------
      # Tags
      # ---------------------------------------------------

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql

        - Key: Environment
          Value: !Ref Environment


  # =======================================================
  # S3 PRODUCT BUCKET
  # =======================================================

  CloudMartProductBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      # ---------------------------------------------------
      # Encryption
      # ---------------------------------------------------

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256


      # ---------------------------------------------------
      # Public Access Block
      # ---------------------------------------------------

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true


      # ---------------------------------------------------
      # Versioning
      # ---------------------------------------------------

      VersioningConfiguration:

        Status: Enabled


      # ---------------------------------------------------
      # Tags
      # ---------------------------------------------------

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-product-bucket

        - Key: Environment
          Value: !Ref Environment


# =========================================================
# OUTPUTS
# =========================================================

Outputs:


  # =======================================================
  # RDS INSTANCE ID
  # =======================================================

  RdsInstanceIdentifier:

    Description:
      CloudMart RDS MySQL instance identifier

    Value:
      !Ref CloudMartDatabase

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsInstanceIdentifier


  # =======================================================
  # RDS ENDPOINT
  # =======================================================

  RdsEndpoint:

    Description:
      CloudMart RDS MySQL endpoint

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Address

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsEndpoint


  # =======================================================
  # RDS PORT
  # =======================================================

  RdsPort:

    Description:
      CloudMart RDS MySQL port

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Port

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsPort


  # =======================================================
  # DATABASE NAME
  # =======================================================

  RdsDatabaseName:

    Description:
      CloudMart MySQL database name

    Value:
      !Ref DBName

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsDatabaseName


  # =======================================================
  # DATABASE USERNAME
  # =======================================================

  RdsUsername:

    Description:
      CloudMart RDS master username

    Value:
      !Ref DBUsername

    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsUsername


  # =======================================================
  # S3 PRODUCT BUCKET
  # =======================================================

  ProductBucketName:

    Description:
      CloudMart product S3 bucket name

    Value:
      !Ref CloudMartProductBucket

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductBucketName