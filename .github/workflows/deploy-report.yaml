name: Deploy Reporting Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  STACK_NAME: cloudmart-dev-reporting

  # =====================================================
  # EXISTING LAMBDA DEPLOYMENT BUCKET
  # =====================================================
  LAMBDA_S3_BUCKET: cloudmart-dev-lambda-430155298316

  # =====================================================
  # EXISTING REPORTS BUCKET
  # =====================================================
  REPORTS_BUCKET: cloudmart-dev-reports-430155298316

  # =====================================================
  # DASHBOARD FILES
  #
  # Dashboard files are stored inside the existing
  # Reports bucket under a separate prefix.
  #
  # reports/              -> existing daily reports
  # cloudmart-dashboard/  -> dashboard application
  # =====================================================
  DASHBOARD_S3_BUCKET: cloudmart-dev-reports-430155298316
  DASHBOARD_S3_PREFIX: cloudmart-dashboard

  # Dashboard source files in GitHub repository
  DASHBOARD_APP_SOURCE: dashboard/app.py
  DASHBOARD_INDEX_SOURCE: dashboard/index.html

  # =====================================================
  # REPORTING LAMBDA SOURCE
  # =====================================================
  REPORT_LAMBDA_SOURCE: lambda/report/lambda_function.py

  # =====================================================
  # SSM DB PARAMETER NAMES
  # =====================================================
  DB_HOST_PARAMETER: /cloudmart/dev/db/host
  DB_PORT_PARAMETER: /cloudmart/dev/db/port
  DB_NAME_PARAMETER: /cloudmart/dev/db/name
  DB_USERNAME_PARAMETER: /cloudmart/dev/db/username
  DB_PASSWORD_PARAMETER: /cloudmart/dev/db/password


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # 3. VERIFY AWS IDENTITY
      # =====================================================

      - name: Verify AWS identity
        run: |

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo ""
          echo "AWS Region: $AWS_REGION"
          echo "Environment: $ENVIRONMENT"


      # =====================================================
      # 4. VERIFY EXISTING LAMBDA S3 BUCKET
      # =====================================================

      - name: Verify Lambda S3 bucket
        run: |

          echo "=========================================="
          echo "CHECKING LAMBDA S3 BUCKET"
          echo "=========================================="

          aws s3api head-bucket \
            --bucket "$LAMBDA_S3_BUCKET"

          echo "Lambda bucket exists."


      # =====================================================
      # 5. VERIFY EXISTING REPORTS S3 BUCKET
      # =====================================================

      - name: Verify Reports S3 bucket
        run: |

          echo "=========================================="
          echo "CHECKING REPORTS S3 BUCKET"
          echo "=========================================="

          aws s3api head-bucket \
            --bucket "$REPORTS_BUCKET"

          echo "Reports bucket exists."


      # =====================================================
      # 6. VERIFY DASHBOARD SOURCE FILES
      # =====================================================

      - name: Verify Dashboard source files
        run: |

          echo "=========================================="
          echo "CHECKING DASHBOARD SOURCE FILES"
          echo "=========================================="

          echo "Checking:"
          echo "$DASHBOARD_APP_SOURCE"
          echo "$DASHBOARD_INDEX_SOURCE"

          test -s "$DASHBOARD_APP_SOURCE"
          test -s "$DASHBOARD_INDEX_SOURCE"

          echo ""
          echo "Dashboard files found successfully."

          echo ""
          echo "Dashboard files:"
          ls -lh \
            "$DASHBOARD_APP_SOURCE" \
            "$DASHBOARD_INDEX_SOURCE"


      # =====================================================
      # 7. UPLOAD DASHBOARD FILES TO S3
      #
      # IMPORTANT:
      # login.html is NOT uploaded because login is now
      # contained inside index.html.
      # =====================================================

      - name: Upload Dashboard Files
        run: |

          echo "=========================================="
          echo "UPLOADING CLOUDMART DASHBOARD"
          echo "=========================================="

          echo "Bucket:"
          echo "$DASHBOARD_S3_BUCKET"

          echo ""
          echo "Prefix:"
          echo "$DASHBOARD_S3_PREFIX"

          echo ""
          echo "Uploading app.py..."

          aws s3 cp \
            "$DASHBOARD_APP_SOURCE" \
            "s3://${DASHBOARD_S3_BUCKET}/${DASHBOARD_S3_PREFIX}/app.py"

          echo ""
          echo "Uploading index.html..."

          aws s3 cp \
            "$DASHBOARD_INDEX_SOURCE" \
            "s3://${DASHBOARD_S3_BUCKET}/${DASHBOARD_S3_PREFIX}/index.html"

          echo ""
          echo "Dashboard files uploaded successfully."


      # =====================================================
      # 8. VERIFY DASHBOARD FILES IN S3
      # =====================================================

      - name: Verify Dashboard files in S3
        run: |

          echo "=========================================="
          echo "VERIFYING DASHBOARD FILES IN S3"
          echo "=========================================="

          aws s3api head-object \
            --bucket "$DASHBOARD_S3_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/app.py"

          aws s3api head-object \
            --bucket "$DASHBOARD_S3_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/index.html"

          echo ""
          echo "Dashboard files verified successfully."

          echo ""
          echo "Current dashboard objects:"
          aws s3 ls \
            "s3://${DASHBOARD_S3_BUCKET}/${DASHBOARD_S3_PREFIX}/"


      # =====================================================
      # 9. VERIFY REPORT LAMBDA SOURCE
      # =====================================================

      - name: Verify report Lambda source
        run: |

          echo "=========================================="
          echo "CHECKING REPORTING LAMBDA SOURCE"
          echo "=========================================="

          test -s "$REPORT_LAMBDA_SOURCE"

          echo ""
          echo "Report Lambda source found:"
          echo "$REPORT_LAMBDA_SOURCE"

          echo ""
          echo "Lambda source size:"
          ls -lh "$REPORT_LAMBDA_SOURCE"


      # =====================================================
      # 10. CREATE LAMBDA PACKAGE DIRECTORY
      # =====================================================

      - name: Prepare Lambda package
        run: |

          echo "=========================================="
          echo "PREPARING LAMBDA PACKAGE"
          echo "=========================================="

          rm -rf build/report

          mkdir -p build/report

          echo "Package directory created."


      # =====================================================
      # 11. INSTALL PYMYSQL
      # =====================================================

      - name: Install Lambda dependencies
        run: |

          echo "=========================================="
          echo "INSTALLING LAMBDA DEPENDENCIES"
          echo "=========================================="

          python -m pip install \
            PyMySQL \
            -t build/report

          echo ""
          echo "PyMySQL installed successfully."


      # =====================================================
      # 12. COPY LAMBDA CODE
      # =====================================================

      - name: Copy Lambda source
        run: |

          echo "=========================================="
          echo "COPYING LAMBDA SOURCE"
          echo "=========================================="

          cp "$REPORT_LAMBDA_SOURCE" \
             build/report/lambda_function.py

          echo ""
          echo "Lambda source copied."


      # =====================================================
      # 13. CREATE ZIP PACKAGE
      # =====================================================

      - name: Package Reporting Lambda
        run: |

          echo "=========================================="
          echo "PACKAGING REPORTING LAMBDA"
          echo "=========================================="

          cd build/report

          zip -r ../../report.zip .

          cd ../..

          echo ""
          echo "Lambda package created."

          echo ""
          echo "Package details:"
          ls -lh report.zip


      # =====================================================
      # 14. UPLOAD LAMBDA PACKAGE TO S3
      # =====================================================

      - name: Upload Lambda package
        env:
          LAMBDA_S3_KEY: report/report-${{ github.sha }}.zip

        run: |

          echo "=========================================="
          echo "UPLOADING REPORTING LAMBDA PACKAGE"
          echo "=========================================="

          aws s3 cp \
            report.zip \
            "s3://${LAMBDA_S3_BUCKET}/${LAMBDA_S3_KEY}"

          echo ""
          echo "Lambda package uploaded:"
          echo "s3://${LAMBDA_S3_BUCKET}/${LAMBDA_S3_KEY}"

          echo ""
          echo "LAMBDA_S3_KEY=$LAMBDA_S3_KEY" >> "$GITHUB_ENV"


      # =====================================================
      # 15. VALIDATE REPORTING CLOUDFORMATION TEMPLATE
      # =====================================================

      - name: Validate Reporting Stack
        run: |

          echo "=========================================="
          echo "VALIDATING CLOUDFORMATION TEMPLATE"
          echo "=========================================="

          aws cloudformation validate-template \
            --template-body file://cloudformation/Reporting-stack.yaml \
            --region "$AWS_REGION"

          echo ""
          echo "Reporting Stack template is valid."


      # =====================================================
      # 16. CHECK REPORTING STACK
      # =====================================================

      - name: Check Reporting Stack
        id: stack
        run: |

          echo "=========================================="
          echo "CHECKING REPORTING STACK"
          echo "=========================================="

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "Reporting Stack already exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "Reporting Stack does not exist."

          fi


      # =====================================================
      # 17. CREATE REPORTING STACK
      # =====================================================

      - name: Create Reporting Stack
        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "=========================================="
          echo "CREATING REPORTING STACK"
          echo "=========================================="

          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body file://cloudformation/Reporting-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=LambdaS3Bucket,ParameterValue="$LAMBDA_S3_BUCKET" \
              ParameterKey=LambdaS3Key,ParameterValue="$LAMBDA_S3_KEY" \
              ParameterKey=ReportsBucketName,ParameterValue="$REPORTS_BUCKET" \
              ParameterKey=DashboardS3Bucket,ParameterValue="$DASHBOARD_S3_BUCKET" \
              ParameterKey=DashboardS3Prefix,ParameterValue="$DASHBOARD_S3_PREFIX" \
              ParameterKey=DbHostParameterName,ParameterValue="$DB_HOST_PARAMETER" \
              ParameterKey=DbPortParameterName,ParameterValue="$DB_PORT_PARAMETER" \
              ParameterKey=DbNameParameterName,ParameterValue="$DB_NAME_PARAMETER" \
              ParameterKey=DbUsernameParameterName,ParameterValue="$DB_USERNAME_PARAMETER" \
              ParameterKey=DbPasswordParameterName,ParameterValue="$DB_PASSWORD_PARAMETER" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"

          echo ""
          echo "Reporting Stack creation started."


      # =====================================================
      # 18. UPDATE REPORTING STACK
      # =====================================================

      - name: Update Reporting Stack
        if: steps.stack.outputs.exists == 'true'

        run: |

          echo "=========================================="
          echo "UPDATING REPORTING STACK"
          echo "=========================================="

          set +e

          UPDATE_OUTPUT=$(aws cloudformation update-stack \
            --stack-name "$STACK_NAME" \
            --template-body file://cloudformation/Reporting-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=LambdaS3Bucket,ParameterValue="$LAMBDA_S3_BUCKET" \
              ParameterKey=LambdaS3Key,ParameterValue="$LAMBDA_S3_KEY" \
              ParameterKey=ReportsBucketName,ParameterValue="$REPORTS_BUCKET" \
              ParameterKey=DashboardS3Bucket,ParameterValue="$DASHBOARD_S3_BUCKET" \
              ParameterKey=DashboardS3Prefix,ParameterValue="$DASHBOARD_S3_PREFIX" \
              ParameterKey=DbHostParameterName,ParameterValue="$DB_HOST_PARAMETER" \
              ParameterKey=DbPortParameterName,ParameterValue="$DB_PORT_PARAMETER" \
              ParameterKey=DbNameParameterName,ParameterValue="$DB_NAME_PARAMETER" \
              ParameterKey=DbUsernameParameterName,ParameterValue="$DB_USERNAME_PARAMETER" \
              ParameterKey=DbPasswordParameterName,ParameterValue="$DB_PASSWORD_PARAMETER" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION" 2>&1)

          UPDATE_EXIT_CODE=$?

          echo "$UPDATE_OUTPUT"

          set -e

          if echo "$UPDATE_OUTPUT" | grep -q "No updates are to be performed"; then

            echo ""
            echo "No CloudFormation changes detected."

          elif [ "$UPDATE_EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "CloudFormation update failed."

            exit "$UPDATE_EXIT_CODE"

          else

            echo ""
            echo "Reporting Stack update started."

          fi


      # =====================================================
      # 19. WAIT FOR STACK COMPLETION
      # =====================================================

      - name: Wait for Reporting Stack
        run: |

          echo "=========================================="
          echo "WAITING FOR REPORTING STACK"
          echo "=========================================="

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text \
            --region "$AWS_REGION")

          echo "Current stack status: $STATUS"

          case "$STATUS" in

            CREATE_IN_PROGRESS)

              echo ""
              echo "Waiting for stack creation..."

              aws cloudformation wait stack-create-complete \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"

              ;;

            UPDATE_IN_PROGRESS)

              echo ""
              echo "Waiting for stack update..."

              aws cloudformation wait stack-update-complete \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"

              ;;

            CREATE_COMPLETE|UPDATE_COMPLETE)

              echo ""
              echo "Stack already completed."

              ;;

            *)

              echo ""
              echo "Unexpected stack status: $STATUS"

              exit 1

              ;;

          esac

          echo ""
          echo "Reporting Stack completed successfully."


      # =====================================================
      # 20. DISPLAY STACK STATUS
      # =====================================================

      - name: Display stack status
        run: |

          echo "=========================================="
          echo "REPORTING STACK STATUS"
          echo "=========================================="

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table \
            --region "$AWS_REGION"


      # =====================================================
      # 21. DISPLAY STACK OUTPUTS
      # =====================================================

      - name: Display Reporting Stack outputs
        run: |

          echo "=========================================="
          echo "REPORTING STACK OUTPUTS"
          echo "=========================================="

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table \
            --region "$AWS_REGION"


      # =====================================================
      # 22. VERIFY REPORTING LAMBDA
      # =====================================================

      - name: Verify Reporting Lambda
        run: |

          echo "=========================================="
          echo "REPORTING LAMBDA"
          echo "=========================================="

          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-ReportGenerator" \
            --region "$AWS_REGION" \
            --query 'Configuration.[FunctionName,Runtime,Handler,Timeout,MemorySize]' \
            --output table

          echo ""
          echo "Reporting Lambda verified successfully."


      # =====================================================
      # 23. VERIFY EVENTBRIDGE RULE
      # =====================================================

      - name: Verify Reporting Schedule
        run: |

          echo "=========================================="
          echo "REPORTING SCHEDULE"
          echo "=========================================="

          aws events list-rules \
            --name-prefix "CloudMart-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --query 'Rules[*].[Name,State,ScheduleExpression]' \
            --output table

          echo ""
          echo "EventBridge reporting schedule verified."


      # =====================================================
      # 24. FINAL DEPLOYMENT SUMMARY
      # =====================================================

      - name: Deployment summary
        run: |

          echo ""
          echo "=================================================="
          echo "       CLOUDMART REPORTING DEPLOYMENT"
          echo "=================================================="

          echo ""
          echo "Environment:"
          echo "  $ENVIRONMENT"

          echo ""
          echo "Reporting Stack:"
          echo "  $STACK_NAME"

          echo ""
          echo "Lambda Bucket:"
          echo "  $LAMBDA_S3_BUCKET"

          echo ""
          echo "Reports Bucket:"
          echo "  $REPORTS_BUCKET"

          echo ""
          echo "Dashboard Location:"
          echo "  s3://${DASHBOARD_S3_BUCKET}/${DASHBOARD_S3_PREFIX}/"

          echo ""
          echo "Dashboard Files:"
          echo "  app.py"
          echo "  index.html"

          echo ""
          echo "Existing reports/ prefix was not modified."

          echo ""
          echo "Login:"
          echo "  Embedded inside index.html"

          echo ""
          echo "Deployment completed successfully."

          echo "=================================================="