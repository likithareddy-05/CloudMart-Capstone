name: Deploy Data Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: cloudmart-dev-data


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # 3. VERIFY AWS IDENTITY
      # =====================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # =====================================================
      # 4. VALIDATE CLOUDFORMATION TEMPLATE
      # =====================================================

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/Data-stack.yaml \
            --region "$AWS_REGION"


      # =====================================================
      # 5. VERIFY RDS CONFIGURATION
      # =====================================================
      #
      # This confirms that the version being deployed contains:
      #
      # MultiAZ: false
      # BackupRetentionPeriod: 0
      #
      # The values themselves are not secrets.
      # =====================================================

      - name: Verify RDS configuration
        run: |

          echo "Checking RDS Multi-AZ configuration..."

          grep -n "MultiAZ:" \
            cloudformation/Data-stack.yaml || true

          echo ""
          echo "Checking RDS backup retention configuration..."

          grep -n "BackupRetentionPeriod:" \
            cloudformation/Data-stack.yaml || true


      # =====================================================
      # 6. CHECK WHETHER STACK EXISTS
      # =====================================================

      - name: Check stack
        id: stack

        run: |

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "Data stack already exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "Data stack does not exist."

          fi


      # =====================================================
      # 7. CREATE DATA STACK
      # =====================================================

      - name: Create Data Stack
        if: steps.stack.outputs.exists == 'false'

        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          echo "Creating CloudMart Data Stack..."

          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body file://cloudformation/Data-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=DBName,ParameterValue="cloudmart" \
              ParameterKey=DBUsername,ParameterValue="cloudmartadmin" \
              ParameterKey=DBPassword,ParameterValue="$DB_PASSWORD" \
            --region "$AWS_REGION"

          echo "CloudFormation create request submitted."


      # =====================================================
      # 8. WAIT FOR STACK CREATION
      # =====================================================
      #
      # IMPORTANT:
      # If CloudFormation fails, this step prints the actual
      # CREATE_FAILED resource and reason instead of showing
      # only ROLLBACK_COMPLETE.
      # =====================================================

      - name: Wait for stack creation
        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "Waiting for CloudFormation stack creation..."

          if aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"; then

            echo ""
            echo "=========================================="
            echo "DATA STACK CREATED SUCCESSFULLY"
            echo "=========================================="

          else

            echo ""
            echo "=========================================="
            echo "DATA STACK CREATION FAILED"
            echo "=========================================="

            echo ""
            echo "CloudFormation stack status:"

            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text || true


            echo ""
            echo "=========================================="
            echo "CREATE FAILED RESOURCES"
            echo "=========================================="

            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true


            echo ""
            echo "=========================================="
            echo "RECENT CLOUDFORMATION EVENTS"
            echo "=========================================="

            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true


            echo ""
            echo "=========================================="
            echo "STACK CREATION FAILED"
            echo "=========================================="

            exit 1

          fi


      # =====================================================
      # 9. CREATE CHANGE SET FOR EXISTING STACK
      # =====================================================

      - name: Create Data Change Set
        if: steps.stack.outputs.exists == 'true'

        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          CHANGE_SET_NAME="data-${GITHUB_SHA}"

          echo "Creating CloudFormation change set..."
          echo "Change Set: $CHANGE_SET_NAME"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type UPDATE \
            --template-body file://cloudformation/Data-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=DBName,ParameterValue="cloudmart" \
              ParameterKey=DBUsername,ParameterValue="cloudmartadmin" \
              ParameterKey=DBPassword,ParameterValue="$DB_PASSWORD" \
            --region "$AWS_REGION"


      # =====================================================
      # 10. WAIT FOR CHANGE SET
      # =====================================================

      - name: Wait for Change Set
        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="data-${GITHUB_SHA}"

          echo "Waiting for change set..."

          if aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"; then

            echo "Change set created successfully."

          else

            echo ""
            echo "=========================================="
            echo "CHANGE SET CREATION FAILED"
            echo "=========================================="

            aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query "StatusReason" \
              --output text || true

            exit 1

          fi


      # =====================================================
      # 11. DISPLAY CHANGE SET
      # =====================================================

      - name: Display Change Set
        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="data-${GITHUB_SHA}"

          echo "=========================================="
          echo "CLOUDFORMATION CHANGES"
          echo "=========================================="

          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION" \
            --query "Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType]" \
            --output table


      # =====================================================
      # 12. EXECUTE CHANGE SET
      # =====================================================

      - name: Execute Change Set
        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="data-${GITHUB_SHA}"

          echo "Executing change set..."

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"


      # =====================================================
      # 13. WAIT FOR STACK UPDATE
      # =====================================================

      - name: Wait for stack update
        if: steps.stack.outputs.exists == 'true'

        run: |

          echo "Waiting for CloudFormation stack update..."

          if aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"; then

            echo ""
            echo "=========================================="
            echo "DATA STACK UPDATED SUCCESSFULLY"
            echo "=========================================="

          else

            echo ""
            echo "=========================================="
            echo "DATA STACK UPDATE FAILED"
            echo "=========================================="

            echo ""
            echo "Current stack status:"

            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text || true


            echo ""
            echo "=========================================="
            echo "FAILED RESOURCES"
            echo "=========================================="

            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='UPDATE_FAILED'].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true


            echo ""
            echo "=========================================="
            echo "RECENT CLOUDFORMATION EVENTS"
            echo "=========================================="

            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true


            exit 1

          fi


      # =====================================================
      # 14. DISPLAY DATA STACK OUTPUTS
      # =====================================================

      - name: Display Data Stack outputs

        run: |

          echo ""
          echo "=========================================="
          echo "DATA STACK OUTPUTS"
          echo "=========================================="

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table