name: Create Auth Token

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AUTH_TOKEN_PARAMETER: /cloudmart/dev/auth/token

jobs:

  create-token:

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      - name: Create SSM SecureString
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        run: |

          aws ssm put-parameter \
            --name "$AUTH_TOKEN_PARAMETER" \
            --type "SecureString" \
            --value "$AUTH_TOKEN" \
            --overwrite \
            --region "$AWS_REGION"


      - name: Verify parameter
        run: |

          aws ssm get-parameter \
            --name "$AUTH_TOKEN_PARAMETER" \
            --region "$AWS_REGION" \
            --query "Parameter.{Name:Name,Type:Type}" \
            --output table