name: Deploy Authentication Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:

  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: cloudmart-dev-auth
  LAMBDA_BUCKET: cloudmart-dev-lambda-430155298316


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ===================================================
      # 1. CHECKOUT REPOSITORY
      # ===================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ===================================================
      # 2. CONFIGURE AWS CREDENTIALS
      # ===================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ===================================================
      # 3. VERIFY AWS ACCESS
      # ===================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ===================================================
      # 4. PREPARE LAMBDA PACKAGE
      # ===================================================

      - name: Prepare Authorizer package

        run: |

          rm -rf package

          mkdir package


      # ===================================================
      # 5. COPY AUTHORiZER CODE
      # ===================================================

      - name: Copy Authorizer Lambda code

        run: |

          cp lambda/authorizer/lambda_function.py package/


      # ===================================================
      # 6. CREATE VERSIONED ZIP
      # ===================================================

      - name: Create Authorizer ZIP

        run: |

          cd package

          zip -r "../authorizer-${GITHUB_SHA}.zip" .

          cd ..


      # ===================================================
      # 7. VERIFY ZIP
      # ===================================================

      - name: Verify Authorizer package

        run: |

          echo "ZIP CONTENTS:"

          unzip -l "authorizer-${GITHUB_SHA}.zip"


      # ===================================================
      # 8. SET VERSIONED S3 KEY
      # ===================================================

      - name: Set Lambda S3 key

        run: |

          echo "LAMBDA_S3_KEY=authorizer/authorizer-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"

          echo "Lambda S3 Key:"
          echo "authorizer/authorizer-${GITHUB_SHA}.zip"


      # ===================================================
      # 9. UPLOAD ZIP TO S3
      # ===================================================

      - name: Upload Authorizer package to S3

        run: |

          echo "Uploading Authorizer package..."

          aws s3 cp \
            "authorizer-${GITHUB_SHA}.zip" \
            "s3://${LAMBDA_BUCKET}/${LAMBDA_S3_KEY}" \
            --region "$AWS_REGION"


      # ===================================================
      # 10. VERIFY S3 OBJECT
      # ===================================================

      - name: Verify S3 package

        run: |

          echo "Checking uploaded package..."

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "$LAMBDA_S3_KEY" \
            --region "$AWS_REGION"

          echo "S3 package verified successfully."


      # ===================================================
      # 11. VALIDATE CLOUDFORMATION TEMPLATE
      # ===================================================

      - name: Validate Auth Stack

        run: |

          echo "Validating Auth Stack..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/Auth-stack.yaml \
            --region "$AWS_REGION"

          echo "CloudFormation template is valid."


      # ===================================================
      # 12. CHECK WHETHER STACK EXISTS
      # ===================================================

      - name: Check Auth Stack

        id: stack

        run: |

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "Auth stack exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "Auth stack does not exist."

          fi


      # ===================================================
      # 13. CREATE AUTH STACK
      # ===================================================

      - name: Create Auth Stack

        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "Creating Auth Stack..."

          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body file://cloudformation/Auth-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=TokenParameterName,ParameterValue="/cloudmart/dev/auth/token" \
              ParameterKey=LambdaS3Key,ParameterValue="$LAMBDA_S3_KEY" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"


      # ===================================================
      # 14. WAIT FOR STACK CREATION
      # ===================================================

      - name: Wait for Auth Stack creation

        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "Waiting for Auth Stack..."

          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          echo "Auth Stack created successfully."


      # ===================================================
      # 15. CREATE CHANGE SET
      # ===================================================

      - name: Create Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          echo "Creating Auth Change Set:"
          echo "$CHANGE_SET_NAME"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type UPDATE \
            --template-body file://cloudformation/Auth-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=TokenParameterName,ParameterValue="/cloudmart/dev/auth/token" \
              ParameterKey=LambdaS3Key,ParameterValue="$LAMBDA_S3_KEY" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"


      # ===================================================
      # 16. WAIT FOR CHANGE SET
      # ===================================================

      - name: Wait for Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          echo "Waiting for Change Set..."

          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

          echo "Change Set created successfully."


      # ===================================================
      # 17. DISPLAY CHANGE SET
      # ===================================================

      - name: Display Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION" \
            --query "Changes[*].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType}" \
            --output table


      # ===================================================
      # 18. EXECUTE CHANGE SET
      # ===================================================

      - name: Execute Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          echo "Executing Change Set..."

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"


      # ===================================================
      # 19. WAIT FOR STACK UPDATE
      # ===================================================

      - name: Wait for Auth Stack update

        if: steps.stack.outputs.exists == 'true'

        run: |

          echo "Waiting for Auth Stack update..."

          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          echo "Auth Stack updated successfully."


      # ===================================================
      # 20. VERIFY LAMBDA
      # ===================================================

      - name: Verify Authorizer Lambda

        run: |

          echo "Checking Authorizer Lambda..."

          aws lambda get-function \
            --function-name CloudMart-dev-Authorizer \
            --region "$AWS_REGION" \
            --query "Configuration.{FunctionName:FunctionName,Runtime:Runtime,Handler:Handler,LastModified:LastModified,CodeSha256:CodeSha256}" \
            --output table


      # ===================================================
      # 21. DISPLAY STACK OUTPUTS
      # ===================================================

      - name: Display Auth Stack outputs

        run: |

          echo "Auth Stack Outputs:"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table