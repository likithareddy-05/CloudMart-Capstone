name: Deploy Authentication Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  STACK_NAME: cloudmart-dev-auth

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT REPOSITORY
      # ==================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==================================================
      # 2. CONFIGURE AWS CREDENTIALS
      # ==================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 3. VERIFY AWS IDENTITY
      # ==================================================

      - name: Verify AWS identity

        run: |

          echo "Checking AWS identity..."

          aws sts get-caller-identity


      # ==================================================
      # 4. GET SHARED LAMBDA S3 BUCKET
      # ==================================================

      - name: Get Lambda S3 bucket

        run: |

          echo "Finding Lambda S3 bucket..."

          LAMBDA_BUCKET=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-LambdaBucket'].Value" \
            --output text)

          if [ -z "$LAMBDA_BUCKET" ] || [ "$LAMBDA_BUCKET" = "None" ]; then

            echo "ERROR: Lambda bucket export not found."

            exit 1

          fi

          echo "LAMBDA_BUCKET=$LAMBDA_BUCKET" >> "$GITHUB_ENV"

          echo "Lambda bucket found successfully."


      # ==================================================
      # 5. VERIFY LAMBDA S3 BUCKET
      # ==================================================

      - name: Verify Lambda S3 bucket

        run: |

          echo "Checking Lambda S3 bucket..."

          aws s3api head-bucket \
            --bucket "$LAMBDA_BUCKET"

          echo "Lambda S3 bucket exists."


      # ==================================================
      # 6. PREPARE AUTHORIZE PACKAGE
      # ==================================================

      - name: Prepare Authorizer package

        run: |

          echo "Preparing Authorizer package..."

          rm -rf package

          mkdir package


      # ==================================================
      # 7. COPY AUTHORIZE LAMBDA CODE
      # ==================================================

      - name: Copy Authorizer Lambda code

        run: |

          echo "Copying Authorizer Lambda code..."

          cp lambda/authorizer/lambda_function.py package/


      # ==================================================
      # 8. CREATE VERSIONED ZIP
      # ==================================================

      - name: Create Authorizer ZIP

        run: |

          echo "Creating Authorizer ZIP..."

          cd package

          zip -r "../authorizer-${GITHUB_SHA}.zip" .

          cd ..

          echo "Authorizer ZIP created successfully."


      # ==================================================
      # 9. VERIFY ZIP
      # ==================================================

      - name: Verify Authorizer ZIP

        run: |

          echo "Authorizer ZIP contents:"

          unzip -l "authorizer-${GITHUB_SHA}.zip"


      # ==================================================
      # 10. SET S3 KEY
      # ==================================================

      - name: Set Lambda S3 key

        run: |

          echo "LAMBDA_S3_KEY=authorizer/authorizer-${GITHUB_SHA}.zip" >> "$GITHUB_ENV"

          echo "Lambda S3 key configured."


      # ==================================================
      # 11. UPLOAD AUTHORIZE PACKAGE
      # ==================================================

      - name: Upload Authorizer package

        run: |

          echo "Uploading Authorizer package..."

          aws s3 cp \
            "authorizer-${GITHUB_SHA}.zip" \
            "s3://${LAMBDA_BUCKET}/${LAMBDA_S3_KEY}" \
            --region "$AWS_REGION"

          echo "Authorizer package uploaded successfully."


      # ==================================================
      # 12. VERIFY S3 OBJECT
      # ==================================================

      - name: Verify S3 object

        run: |

          echo "Checking uploaded S3 object..."

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "$LAMBDA_S3_KEY" \
            --region "$AWS_REGION"

          echo "S3 object verified successfully."


      # ==================================================
      # 13. CREATE / UPDATE USER SECURE STRING
      # ==================================================

      - name: Create or update USER SecureString

        env:

          USER_TOKEN: ${{ secrets.CLOUDMART_USER_TOKEN }}

        run: |

          echo "Creating/updating USER SecureString..."

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/user-token" \
            --value "$USER_TOKEN" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION"

          echo "USER SecureString created/updated successfully."


      # ==================================================
      # 14. CREATE / UPDATE ADMIN SECURE STRING
      # ==================================================

      - name: Create or update ADMIN SecureString

        env:

          ADMIN_TOKEN: ${{ secrets.CLOUDMART_ADMIN_TOKEN }}

        run: |

          echo "Creating/updating ADMIN SecureString..."

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/admin-token" \
            --value "$ADMIN_TOKEN" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION"

          echo "ADMIN SecureString created/updated successfully."


      # ==================================================
      # 15. VERIFY USER SSM PARAMETER
      # ==================================================

      - name: Verify USER SSM parameter

        run: |

          echo "Checking USER SSM parameter..."

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/user-token" \
            --region "$AWS_REGION" \
            --query "Parameter.{Name:Name,Type:Type}" \
            --output table

          echo "USER SSM parameter verified."


      # ==================================================
      # 16. VERIFY ADMIN SSM PARAMETER
      # ==================================================

      - name: Verify ADMIN SSM parameter

        run: |

          echo "Checking ADMIN SSM parameter..."

          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/admin-token" \
            --region "$AWS_REGION" \
            --query "Parameter.{Name:Name,Type:Type}" \
            --output table

          echo "ADMIN SSM parameter verified."


      # ==================================================
      # 17. VALIDATE CLOUDFORMATION TEMPLATE
      # ==================================================

      - name: Validate Auth Stack

        run: |

          echo "Validating Auth CloudFormation template..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/Auth-stack.yaml \
            --region "$AWS_REGION"

          echo "Auth CloudFormation template is valid."


      # ==================================================
      # 18. VERIFY CLOUDFORMATION PARAMETERS
      # ==================================================

      - name: Verify Auth template parameters

        run: |

          echo "CloudFormation parameters:"

          aws cloudformation validate-template \
            --template-body file://cloudformation/Auth-stack.yaml \
            --region "$AWS_REGION" \
            --query "Parameters[*].ParameterKey" \
            --output table


      # ==================================================
      # 19. CHECK WHETHER STACK EXISTS
      # ==================================================

      - name: Check Auth Stack

        id: stack

        run: |

          echo "Checking whether Auth Stack exists..."

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "Auth Stack exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "Auth Stack does not exist."

          fi


      # ==================================================
      # 20. CREATE AUTH STACK
      # ==================================================

      - name: Create Auth Stack

        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "Creating Auth Stack..."

          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body file://cloudformation/Auth-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=UserTokenParameterName,ParameterValue="/cloudmart/${ENVIRONMENT}/auth/user-token" \
              ParameterKey=AdminTokenParameterName,ParameterValue="/cloudmart/${ENVIRONMENT}/auth/admin-token" \
              ParameterKey=LambdaS3Key,ParameterValue="$LAMBDA_S3_KEY" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"

          echo "Auth Stack creation started."


      # ==================================================
      # 21. WAIT FOR STACK CREATION
      # ==================================================

      - name: Wait for Auth Stack creation

        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "Waiting for Auth Stack creation..."

          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          echo "Auth Stack created successfully."


      # ==================================================
      # 22. CREATE UPDATE CHANGE SET
      # ==================================================

      - name: Create Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          echo "Creating Auth Change Set:"
          echo "$CHANGE_SET_NAME"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type UPDATE \
            --template-body file://cloudformation/Auth-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=UserTokenParameterName,ParameterValue="/cloudmart/${ENVIRONMENT}/auth/user-token" \
              ParameterKey=AdminTokenParameterName,ParameterValue="/cloudmart/${ENVIRONMENT}/auth/admin-token" \
              ParameterKey=LambdaS3Key,ParameterValue="$LAMBDA_S3_KEY" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"

          echo "Change Set creation requested."


      # ==================================================
      # 23. WAIT FOR CHANGE SET
      # ==================================================

      - name: Wait for Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          echo "Waiting for Change Set..."

          if aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"; then

            echo "Change Set created successfully."

          else

            echo "=========================================="
            echo "CHANGE SET CREATION FAILED"
            echo "=========================================="

            echo "Getting Change Set details..."

            aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION" \
              --query "{Status:Status,StatusReason:StatusReason,ExecutionStatus:ExecutionStatus}" \
              --output table

            echo "=========================================="
            echo "FULL CHANGE SET DETAILS"
            echo "=========================================="

            aws cloudformation describe-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            exit 1

          fi


      # ==================================================
      # 24. DISPLAY CHANGE SET
      # ==================================================

      - name: Display Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          echo "Change Set details:"

          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION" \
            --query "Changes[*].ResourceChange.{Action:Action,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType}" \
            --output table


      # ==================================================
      # 25. EXECUTE CHANGE SET
      # ==================================================

      - name: Execute Auth Change Set

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="auth-${GITHUB_SHA}"

          echo "Executing Auth Change Set..."

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

          echo "Change Set execution started."


      # ==================================================
      # 26. WAIT FOR STACK UPDATE
      # ==================================================

      - name: Wait for Auth Stack update

        if: steps.stack.outputs.exists == 'true'

        run: |

          echo "Waiting for Auth Stack update..."

          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          echo "Auth Stack updated successfully."


      # ==================================================
      # 27. VERIFY STACK STATUS
      # ==================================================

      - name: Verify Auth Stack status

        run: |

          echo "Auth Stack status:"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # ==================================================
      # 28. VERIFY AUTHORIZER LAMBDA
      # ==================================================

      - name: Verify Authorizer Lambda

        run: |

          echo "Checking Authorizer Lambda..."

          aws lambda get-function-configuration \
            --function-name CloudMart-dev-Authorizer \
            --region "$AWS_REGION" \
            --query "{
              FunctionName:FunctionName,
              Runtime:Runtime,
              Handler:Handler,
              State:State,
              LastModified:LastModified
            }" \
            --output table


      # ==================================================
      # 29. DISPLAY STACK OUTPUTS
      # ==================================================

      - name: Display Auth Stack outputs

        run: |

          echo "Auth Stack Outputs:"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table