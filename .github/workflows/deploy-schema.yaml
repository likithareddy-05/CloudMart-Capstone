name: Deploy RDS Schema

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev
  FUNCTION_NAME: CloudMart-dev-SchemaRunner
  LAMBDA_BUCKET: cloudmart-dev-lambda-430155298316
  LAMBDA_ROLE_NAME: CloudMart-dev-ProductLambdaRole
  NETWORK_STACK: cloudmart-dev-network
  DATA_STACK: cloudmart-dev-data

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # 3. VERIFY AWS
      # =====================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # =====================================================
      # 4. VERIFY REQUIRED STACKS
      # =====================================================

      - name: Verify infrastructure
        run: |

          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION"

          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION"


      # =====================================================
      # 5. GET NETWORK INFORMATION
      # =====================================================

      - name: Get Network information
        run: |

          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue" \
            --output text)

          PRIVATE_SUBNET=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnetId'].OutputValue" \
            --output text)

          LAMBDA_SG=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue" \
            --output text)

          echo "VPC_ID=$VPC_ID"
          echo "PRIVATE_SUBNET=$PRIVATE_SUBNET"
          echo "LAMBDA_SG=$LAMBDA_SG"

          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET=$PRIVATE_SUBNET" >> "$GITHUB_ENV"
          echo "LAMBDA_SG=$LAMBDA_SG" >> "$GITHUB_ENV"


      # =====================================================
      # 6. GET LAMBDA EXECUTION ROLE
      # =====================================================

      - name: Get Lambda execution role
        run: |

          ROLE_ARN=$(aws iam get-role \
            --role-name "$LAMBDA_ROLE_NAME" \
            --query "Role.Arn" \
            --output text)

          echo "ROLE_ARN=$ROLE_ARN"

          echo "ROLE_ARN=$ROLE_ARN" >> "$GITHUB_ENV"


      # =====================================================
      # 7. CREATE DEPLOYMENT PACKAGE
      # =====================================================

      - name: Create schema Lambda package
        run: |

          rm -rf package
          rm -f schema-runner.zip

          mkdir package

          pip install PyMySQL \
            --target package

          cp lambda/schema-runner/lambda_function.py package/

          cp database/schema.sql package/

          cd package

          zip -r ../schema-runner.zip .

          cd ..


      # =====================================================
      # 8. VERIFY PACKAGE
      # =====================================================

      - name: Verify package
        run: |

          ls -lh schema-runner.zip

          unzip -l schema-runner.zip


      # =====================================================
      # 9. UPLOAD PACKAGE TO S3
      # =====================================================

      - name: Upload schema package
        run: |

          aws s3 cp \
            schema-runner.zip \
            "s3://${LAMBDA_BUCKET}/schema/schema-runner.zip" \
            --region "$AWS_REGION"


      # =====================================================
      # 10. CHECK IF SCHEMA LAMBDA EXISTS
      # =====================================================

      - name: Check Schema Lambda
        id: lambda
        run: |

          if aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # =====================================================
      # 11. CREATE SCHEMA LAMBDA
      # =====================================================

      - name: Create Schema Lambda
        if: steps.lambda.outputs.exists == 'false'
        run: |

          aws lambda create-function \
            --function-name "$FUNCTION_NAME" \
            --runtime python3.12 \
            --handler lambda_function.lambda_handler \
            --role "$ROLE_ARN" \
            --code S3Bucket="$LAMBDA_BUCKET",S3Key=schema/schema-runner.zip \
            --timeout 120 \
            --memory-size 256 \
            --environment "Variables={
              ENVIRONMENT=dev
            }" \
            --vpc-config "SubnetIds=$PRIVATE_SUBNET,SecurityGroupIds=$LAMBDA_SG" \
            --region "$AWS_REGION"


      # =====================================================
      # 12. UPDATE SCHEMA LAMBDA
      # =====================================================

      - name: Update Schema Lambda
        if: steps.lambda.outputs.exists == 'true'
        run: |

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$LAMBDA_BUCKET" \
            --s3-key schema/schema-runner.zip \
            --region "$AWS_REGION"

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime python3.12 \
            --handler lambda_function.lambda_handler \
            --timeout 120 \
            --memory-size 256 \
            --environment "Variables={
              ENVIRONMENT=dev
            }" \
            --vpc-config "SubnetIds=$PRIVATE_SUBNET,SecurityGroupIds=$LAMBDA_SG" \
            --region "$AWS_REGION"


      # =====================================================
      # 13. WAIT FOR UPDATE
      # =====================================================

      - name: Wait for Lambda
        run: |

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"


      # =====================================================
      # 14. INVOKE SCHEMA RUNNER
      # =====================================================

      - name: Apply database schema
        run: |

          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --invocation-type RequestResponse \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            schema-response.json \
            --region "$AWS_REGION"

          echo "===== SCHEMA RESPONSE ====="

          cat schema-response.json


      # =====================================================
      # 15. CHECK LAMBDA RESPONSE
      # =====================================================

      - name: Verify schema deployment
        run: |

          cat schema-response.json

          if grep -q '"statusCode": 200' schema-response.json; then

            echo "Schema deployment successful."

          else

            echo "Schema deployment failed."

            exit 1

          fi


      # =====================================================
      # 16. SHOW LOG GROUP
      # =====================================================

      - name: Show Schema Runner logs
        run: |

          aws logs describe-log-streams \
            --log-group-name "/aws/lambda/$FUNCTION_NAME" \
            --order-by LastEventTime \
            --descending \
            --max-items 5 \
            --region "$AWS_REGION" || true