name: Deploy Schema Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:

  AWS_REGION: ap-south-1

  ENVIRONMENT: dev

  STACK_NAME: cloudmart-dev-schema

  NETWORK_STACK: cloudmart-dev-network

  DATA_STACK: cloudmart-dev-data


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:


      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # 2. AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # 3. VERIFY AWS
      # =====================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # =====================================================
      # 4. GET LAMBDA BUCKET
      # =====================================================

      - name: Get Lambda bucket

        run: |

          LAMBDA_BUCKET=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-LambdaBucket'].Value" \
            --output text)

          echo "Lambda bucket: $LAMBDA_BUCKET"

          if [ -z "$LAMBDA_BUCKET" ] || [ "$LAMBDA_BUCKET" = "None" ]; then

            echo "ERROR: Lambda bucket not found."

            exit 1

          fi

          echo "LAMBDA_BUCKET=$LAMBDA_BUCKET" >> "$GITHUB_ENV"


      # =====================================================
      # 5. CREATE LAMBDA PACKAGE
      # =====================================================

      - name: Create Schema Lambda package

        run: |

          echo "Creating Lambda package..."

          rm -rf package

          rm -f schema-runner.zip

          mkdir package


          # Install PyMySQL

          python -m pip install \
            PyMySQL \
            --target package


          # Copy Lambda code

          cp lambda/schema-runner/lambda_function.py package/


          # Copy schema

          cp database/schema.sql package/


          # Create ZIP

          cd package

          zip -r ../schema-runner.zip .

          cd ..


      # =====================================================
      # 6. VERIFY ZIP
      # =====================================================

      - name: Verify package

        run: |

          echo "Schema package contents:"

          unzip -l schema-runner.zip


      # =====================================================
      # 7. UPLOAD ZIP TO S3
      # =====================================================

      - name: Upload Schema Lambda package

        run: |

          aws s3 cp \
            schema-runner.zip \
            "s3://${LAMBDA_BUCKET}/schema/schema-runner.zip" \
            --region "$AWS_REGION"


      # =====================================================
      # 8. VERIFY NETWORK STACK
      # =====================================================

      - name: Verify Network Stack

        run: |

          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # =====================================================
      # 9. VERIFY DATA STACK
      # =====================================================

      - name: Verify Data Stack

        run: |

          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # =====================================================
      # 10. CHECK SCHEMA STACK
      # =====================================================

      - name: Check Schema Stack

        id: stack

        run: |

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # =====================================================
      # 11. CREATE SCHEMA STACK
      # =====================================================

      - name: Create Schema Stack

        if: steps.stack.outputs.exists == 'false'

        run: |

          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body file://cloudformation/Schema-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=LambdaS3Key,ParameterValue=schema/schema-runner.zip \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"


      # =====================================================
      # 12. WAIT FOR CREATE
      # =====================================================

      - name: Wait for Schema Stack creation

        if: steps.stack.outputs.exists == 'false'

        run: |

          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"


      # =====================================================
      # 13. UPDATE SCHEMA STACK
      # =====================================================

      - name: Update Schema Stack

        if: steps.stack.outputs.exists == 'true'

        run: |

          CHANGE_SET_NAME="schema-${GITHUB_SHA}"

          echo "Creating change set: $CHANGE_SET_NAME"


          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type UPDATE \
            --template-body file://cloudformation/Schema-stack.yaml \
            --parameters \
              ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              ParameterKey=LambdaS3Key,ParameterValue=schema/schema-runner.zip \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"


          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"


          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"


      # =====================================================
      # 14. WAIT FOR UPDATE
      # =====================================================

      - name: Wait for Schema Stack update

        if: steps.stack.outputs.exists == 'true'

        run: |

          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"


      # =====================================================
      # 15. WAIT FOR LAMBDA TO BE READY
      # =====================================================

      - name: Wait for Schema Lambda

        run: |

          aws lambda wait function-updated \
            --function-name CloudMart-dev-SchemaRunner \
            --region "$AWS_REGION" || true


      # =====================================================
      # 16. INVOKE SCHEMA RUNNER
      # =====================================================

      - name: Apply RDS schema

        run: |

          echo "Applying database schema..."

          aws lambda invoke \
            --function-name CloudMart-dev-SchemaRunner \
            --invocation-type RequestResponse \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            schema-response.json \
            --region "$AWS_REGION"


          echo "========================================"

          echo "SCHEMA RESPONSE"

          echo "========================================"

          cat schema-response.json


      # =====================================================
      # 17. VERIFY RESULT
      # =====================================================

      - name: Verify schema deployment

        run: |

          if grep -q '"statusCode": 200' schema-response.json; then

            echo "========================================"

            echo "RDS SCHEMA DEPLOYMENT SUCCESSFUL"

            echo "========================================"

          else

            echo "========================================"

            echo "RDS SCHEMA DEPLOYMENT FAILED"

            echo "========================================"

            exit 1

          fi


      # =====================================================
      # 18. DISPLAY OUTPUTS
      # =====================================================

      - name: Display Schema Stack outputs

        run: |

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs"