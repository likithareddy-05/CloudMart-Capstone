name: Deploy RDS Schema

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  # =====================================================
  # EXISTING RESOURCES
  # =====================================================

  NETWORK_STACK: cloudmart-dev-network
  DATA_STACK: cloudmart-dev-data

  LAMBDA_BUCKET: cloudmart-dev-lambda-430155298316

  # Existing Lambda execution role
  LAMBDA_ROLE_NAME: CloudMart-dev-ProductLambdaRole

  # Temporary schema runner Lambda
  FUNCTION_NAME: CloudMart-dev-SchemaRunner


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # 2. CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # 3. VERIFY AWS IDENTITY
      # =====================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # =====================================================
      # 4. VERIFY NETWORK STACK
      # =====================================================

      - name: Verify Network Stack

        run: |

          echo "Checking Network Stack..."

          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # =====================================================
      # 5. VERIFY DATA STACK
      # =====================================================

      - name: Verify Data Stack

        run: |

          echo "Checking Data Stack..."

          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # =====================================================
      # 6. GET NETWORK INFORMATION
      # =====================================================

      - name: Get Network information

        run: |

          echo "========================================"
          echo "Getting VPC ID..."
          echo "========================================"

          VPC_ID=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-VpcId'].Value" \
            --output text)


          echo "========================================"
          echo "Getting Private Subnet..."
          echo "========================================"

          PRIVATE_SUBNET=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-PrivateSubnetId'].Value" \
            --output text)


          echo "========================================"
          echo "Getting Lambda Security Group..."
          echo "========================================"

          LAMBDA_SG=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-LambdaSecurityGroupId'].Value" \
            --output text)


          echo "========================================"
          echo "NETWORK INFORMATION"
          echo "========================================"

          echo "VPC_ID:         $VPC_ID"
          echo "PRIVATE_SUBNET: $PRIVATE_SUBNET"
          echo "LAMBDA_SG:      $LAMBDA_SG"

          echo "========================================"


          # =================================================
          # VALIDATE VPC
          # =================================================

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then

            echo "ERROR: VPC ID was not found."

            exit 1

          fi


          # =================================================
          # VALIDATE PRIVATE SUBNET
          # =================================================

          if [ -z "$PRIVATE_SUBNET" ] || [ "$PRIVATE_SUBNET" = "None" ]; then

            echo "ERROR: Private subnet was not found."

            exit 1

          fi


          # =================================================
          # VALIDATE LAMBDA SECURITY GROUP
          # =================================================

          if [ -z "$LAMBDA_SG" ] || [ "$LAMBDA_SG" = "None" ]; then

            echo "ERROR: Lambda security group was not found."

            exit 1

          fi


          # =================================================
          # VALIDATE SECURITY GROUP FORMAT
          # =================================================

          if [[ ! "$LAMBDA_SG" =~ ^sg-[0-9a-zA-Z]+$ ]]; then

            echo "ERROR: Invalid Lambda Security Group ID: $LAMBDA_SG"

            exit 1

          fi


          echo "Network configuration verified successfully."


          # =================================================
          # SAVE VALUES FOR NEXT STEPS
          # =================================================

          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"

          echo "PRIVATE_SUBNET=$PRIVATE_SUBNET" >> "$GITHUB_ENV"

          echo "LAMBDA_SG=$LAMBDA_SG" >> "$GITHUB_ENV"


      # =====================================================
      # 7. VERIFY LAMBDA SECURITY GROUP
      # =====================================================

      - name: Verify Lambda Security Group

        run: |

          echo "Checking Lambda Security Group..."

          aws ec2 describe-security-groups \
            --group-ids "$LAMBDA_SG" \
            --region "$AWS_REGION" \
            --query "SecurityGroups[0].[GroupId,GroupName,VpcId]" \
            --output table


      # =====================================================
      # 8. GET LAMBDA EXECUTION ROLE
      # =====================================================

      - name: Get Lambda execution role

        run: |

          echo "Getting Lambda execution role..."

          ROLE_ARN=$(aws iam get-role \
            --role-name "$LAMBDA_ROLE_NAME" \
            --query "Role.Arn" \
            --output text)


          if [ -z "$ROLE_ARN" ] || [ "$ROLE_ARN" = "None" ]; then

            echo "ERROR: Lambda execution role was not found."

            exit 1

          fi


          echo "ROLE_ARN=$ROLE_ARN"

          echo "ROLE_ARN=$ROLE_ARN" >> "$GITHUB_ENV"


      # =====================================================
      # 9. CREATE LAMBDA DEPLOYMENT PACKAGE
      # =====================================================

      - name: Create schema Lambda package

        run: |

          echo "Creating Lambda package..."

          rm -rf package

          rm -f schema-runner.zip

          mkdir package


          # -------------------------------------------------
          # Install PyMySQL
          # -------------------------------------------------

          python -m pip install \
            PyMySQL \
            --target package


          # -------------------------------------------------
          # Copy Lambda code
          # -------------------------------------------------

          cp lambda/schema-runner/lambda_function.py package/


          # -------------------------------------------------
          # Copy SQL schema
          # -------------------------------------------------

          cp database/schema.sql package/


          # -------------------------------------------------
          # Create ZIP
          # -------------------------------------------------

          cd package

          zip -r ../schema-runner.zip .

          cd ..


      # =====================================================
      # 10. VERIFY ZIP PACKAGE
      # =====================================================

      - name: Verify Lambda package

        run: |

          echo "Checking Lambda package..."

          ls -lh schema-runner.zip

          echo "========================================"

          echo "ZIP CONTENTS"

          echo "========================================"

          unzip -l schema-runner.zip


          echo "========================================"

          echo "Checking required files..."

          unzip -l schema-runner.zip | grep lambda_function.py

          unzip -l schema-runner.zip | grep schema.sql


      # =====================================================
      # 11. UPLOAD PACKAGE TO S3
      # =====================================================

      - name: Upload schema package

        run: |

          echo "Uploading schema package to S3..."

          aws s3 cp \
            schema-runner.zip \
            "s3://${LAMBDA_BUCKET}/schema/schema-runner.zip" \
            --region "$AWS_REGION"


          echo "Package uploaded successfully."


      # =====================================================
      # 12. CHECK WHETHER SCHEMA LAMBDA EXISTS
      # =====================================================

      - name: Check Schema Lambda

        id: lambda

        run: |

          if aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "Schema Lambda already exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "Schema Lambda does not exist."

          fi


      # =====================================================
      # 13. CREATE SCHEMA LAMBDA
      # =====================================================

      - name: Create Schema Lambda

        if: steps.lambda.outputs.exists == 'false'

        run: |

          echo "========================================"
          echo "CREATING SCHEMA LAMBDA"
          echo "========================================"

          echo "Function:       $FUNCTION_NAME"

          echo "Role:           $ROLE_ARN"

          echo "VPC:            $VPC_ID"

          echo "Subnet:         $PRIVATE_SUBNET"

          echo "Security Group: $LAMBDA_SG"

          echo "========================================"


          aws lambda create-function \
            --function-name "$FUNCTION_NAME" \
            --runtime python3.12 \
            --handler lambda_function.lambda_handler \
            --role "$ROLE_ARN" \
            --code S3Bucket="$LAMBDA_BUCKET",S3Key=schema/schema-runner.zip \
            --timeout 120 \
            --memory-size 256 \
            --environment "Variables={ENVIRONMENT=$ENVIRONMENT}" \
            --vpc-config "SubnetIds=$PRIVATE_SUBNET,SecurityGroupIds=$LAMBDA_SG" \
            --region "$AWS_REGION"


      # =====================================================
      # 14. UPDATE SCHEMA LAMBDA
      # =====================================================

      - name: Update Schema Lambda

        if: steps.lambda.outputs.exists == 'true'

        run: |

          echo "Updating Schema Lambda code..."

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$LAMBDA_BUCKET" \
            --s3-key schema/schema-runner.zip \
            --region "$AWS_REGION"


      # =====================================================
      # 15. WAIT FOR CODE UPDATE
      # =====================================================

      - name: Wait for Lambda code update

        run: |

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"


      # =====================================================
      # 16. UPDATE LAMBDA CONFIGURATION
      # =====================================================

      - name: Update Lambda configuration

        if: steps.lambda.outputs.exists == 'true'

        run: |

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --handler lambda_function.lambda_handler \
            --timeout 120 \
            --memory-size 256 \
            --environment "Variables={ENVIRONMENT=$ENVIRONMENT}" \
            --vpc-config "SubnetIds=$PRIVATE_SUBNET,SecurityGroupIds=$LAMBDA_SG" \
            --region "$AWS_REGION"


      # =====================================================
      # 17. WAIT FOR LAMBDA
      # =====================================================

      - name: Wait for Lambda

        run: |

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"


      # =====================================================
      # 18. INVOKE SCHEMA RUNNER
      # =====================================================

      - name: Apply database schema

        run: |

          echo "========================================"

          echo "Applying RDS schema..."

          echo "========================================"


          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --invocation-type RequestResponse \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            schema-response.json \
            --region "$AWS_REGION"


          echo "========================================"

          echo "SCHEMA LAMBDA RESPONSE"

          echo "========================================"

          cat schema-response.json


      # =====================================================
      # 19. VERIFY SCHEMA DEPLOYMENT
      # =====================================================

      - name: Verify schema deployment

        run: |

          echo "Checking schema deployment result..."

          cat schema-response.json


          if grep -q '"statusCode": 200' schema-response.json; then

            echo "========================================"

            echo "RDS SCHEMA DEPLOYMENT SUCCESSFUL"

            echo "========================================"

          else

            echo "========================================"

            echo "RDS SCHEMA DEPLOYMENT FAILED"

            echo "========================================"

            exit 1

          fi


      # =====================================================
      # 20. SHOW LAMBDA LOG GROUP
      # =====================================================

      - name: Show Schema Runner log group

        run: |

          echo "Schema Lambda log group:"

          echo "/aws/lambda/$FUNCTION_NAME"


      # =====================================================
      # 21. VERIFY LAMBDA CONFIGURATION
      # =====================================================

      - name: Verify Lambda VPC configuration

        run: |

          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query "{
              FunctionName:FunctionName,
              Runtime:Runtime,
              Handler:Handler,
              VpcId:VpcConfig.VpcId,
              SubnetIds:VpcConfig.SubnetIds,
              SecurityGroupIds:VpcConfig.SecurityGroupIds
            }"