name: Deploy CloudMart - Full Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK: cloudmart-dev-network
  DATA_STACK: cloudmart-dev-data
  SECURITY_STACK: cloudmart-dev-security
  SCHEMA_STACK: cloudmart-dev-schema
  AUTH_STACK: cloudmart-dev-auth
  API_STACK: cloudmart-dev-api
  REPORTING_STACK: cloudmart-dev-reporting
  MONITORING_STACK: cloudmart-dev-monitoring

  DASHBOARD_S3_PREFIX: cloudmart-dashboard
  DB_NAME: cloudmart
  DB_USERNAME: cloudmartadmin

jobs:

  # =========================================================
  # 1. NETWORK
  # =========================================================
  network:
    name: 1 - Network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation templates
        run: |
          set -euo pipefail

          for template in \
            cloudformation/Network-stack.yaml \
            cloudformation/Data-stack.yaml \
            cloudformation/Security-stack.yaml \
            cloudformation/schema-stack.yaml \
            cloudformation/Auth-stack.yaml \
            cloudformation/api-stack.yaml \
            cloudformation/Reporting-stack.yaml \
            cloudformation/monitoring-stack.yaml
          do
            echo "========================================"
            echo "Validating $template"
            echo "========================================"

            aws cloudformation validate-template \
              --template-body "file://$template" \
              --region "$AWS_REGION" >/dev/null

            echo "$template is valid."
          done

      - name: Deploy Network stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$NETWORK_STACK" \
            --template-file cloudformation/Network-stack.yaml \
            --parameter-overrides Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Network status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "ERROR: Network stack is not ready."
              exit 1
              ;;
          esac


  # =========================================================
  # 2. SSM - PRE-DATA PARAMETERS ONLY
  # =========================================================
  #
  # Created before Data because Data needs db/password when
  # creating the RDS master password.
  #
  # Notification email values are stored persistently in SSM.
  # This workflow only verifies the existing values and reuses them;
  # they are NOT requested as workflow inputs on every deployment.
  #
  # Data stack itself creates:
  #   /cloudmart/dev/db/host
  #   /cloudmart/dev/db/port
  #   /cloudmart/dev/db/name
  #   /cloudmart/dev/db/username
  #
  # =========================================================
  ssm:
    name: 2 - SSM
    needs: network
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create DB password SecureString
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          aws ssm put-parameter \
            --name "/cloudmart/$ENVIRONMENT/db/password" \
            --type SecureString \
            --value "$DB_PASSWORD" \
            --overwrite \
            --region "$AWS_REGION"

          echo "DB password SecureString created/updated."

      - name: Verify existing Order Email parameter
        run: |
          set -euo pipefail

          aws ssm get-parameter \
            --name "/cloudmart/$ENVIRONMENT/notifications/order-email" \
            --region "$AWS_REGION" \
            --query 'Parameter.{Name:Name,Type:Type}' \
            --output table

          echo "Order email parameter already exists. Keeping the stored value."

      - name: Verify existing Low Stock Email parameter
        run: |
          set -euo pipefail

          aws ssm get-parameter \
            --name "/cloudmart/$ENVIRONMENT/notifications/low-stock-email" \
            --region "$AWS_REGION" \
            --query 'Parameter.{Name:Name,Type:Type}' \
            --output table

          echo "Low-stock email parameter already exists. Keeping the stored value."

      - name: Verify pre-Data SSM parameters
        run: |
          set -euo pipefail

          for name in \
            "/cloudmart/$ENVIRONMENT/db/password" \
            "/cloudmart/$ENVIRONMENT/notifications/order-email" \
            "/cloudmart/$ENVIRONMENT/notifications/low-stock-email"
          do
            aws ssm get-parameter \
              --name "$name" \
              --region "$AWS_REGION" \
              --query 'Parameter.{Name:Name,Type:Type}' \
              --output table
          done


  # =========================================================
  # 3. DATA
  # =========================================================
  data:
    name: 3 - Data
    needs: ssm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$DATA_STACK" \
            --template-file cloudformation/Data-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="$DB_NAME" \
              DBUsername="$DB_USERNAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Data status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "ERROR: Data stack is not ready."
              exit 1
              ;;
          esac

      - name: Verify RDS-derived SSM parameters
        run: |
          set -euo pipefail

          for name in \
            "/cloudmart/$ENVIRONMENT/db/host" \
            "/cloudmart/$ENVIRONMENT/db/port" \
            "/cloudmart/$ENVIRONMENT/db/name" \
            "/cloudmart/$ENVIRONMENT/db/username"
          do
            aws ssm get-parameter \
              --name "$name" \
              --region "$AWS_REGION" \
              --query 'Parameter.{Name:Name,Type:Type}' \
              --output table
          done

      - name: Display Data outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # =========================================================
  # 4. SECURITY
  # =========================================================
  security:
    name: 4 - Security
    needs: data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Reports bucket
        id: buckets
        run: |
          set -euo pipefail

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          if [ -z "$REPORTS_BUCKET" ] || [ "$REPORTS_BUCKET" = "None" ]; then
            echo "ERROR: ReportsBucketName output not found."
            exit 1
          fi

          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Deploy Security stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$SECURITY_STACK" \
            --template-file cloudformation/Security-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DashboardS3Bucket="${{ steps.buckets.outputs.reports_bucket }}" \
              DashboardS3Prefix="$DASHBOARD_S3_PREFIX" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Security stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$SECURITY_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Security status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "ERROR: Security stack is not ready."
              exit 1
              ;;
          esac


  # =========================================================
  # 5. ARTIFACTS
  # =========================================================
  # Packages and uploads all six Lambda deployment packages and
  # the dashboard files before Schema/Auth/API/Reporting need them.
  # =========================================================
  artifacts:
    name: 5 - Artifacts
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get artifact buckets
        run: |
          set -euo pipefail

          LAMBDA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_BUCKET" ] || [ "$LAMBDA_BUCKET" = "None" ]; then
            echo "ERROR: LambdaBucket output not found."
            exit 1
          fi

          if [ -z "$REPORTS_BUCKET" ] || [ "$REPORTS_BUCKET" = "None" ]; then
            echo "ERROR: ReportsBucketName output not found."
            exit 1
          fi

          echo "LAMBDA_BUCKET=$LAMBDA_BUCKET" >> "$GITHUB_ENV"
          echo "REPORTS_BUCKET=$REPORTS_BUCKET" >> "$GITHUB_ENV"

      - name: Prepare packaging tools
        run: |
          python3 --version
          python3 -m pip install --upgrade pip

      - name: Package Product Lambda
        run: |
          set -euo pipefail
          rm -rf /tmp/product-package product.zip
          mkdir -p /tmp/product-package
          python3 -m pip install PyMySQL -t /tmp/product-package --no-compile
          cp lambda/product/lambda_function.py /tmp/product-package/
          (cd /tmp/product-package && zip -qr "$GITHUB_WORKSPACE/product.zip" .)

      - name: Package Inventory Alert Lambda
        run: |
          set -euo pipefail
          rm -rf /tmp/inventory-alert-package inventory-alert.zip
          mkdir -p /tmp/inventory-alert-package
          cp lambda/inventory-alert/lambda_function.py /tmp/inventory-alert-package/
          (cd /tmp/inventory-alert-package && zip -qr "$GITHUB_WORKSPACE/inventory-alert.zip" .)

      - name: Package Order Lambda
        run: |
          set -euo pipefail
          rm -rf /tmp/order-package order.zip
          mkdir -p /tmp/order-package
          python3 -m pip install PyMySQL -t /tmp/order-package --no-compile
          cp lambda/order/lambda_function.py /tmp/order-package/
          (cd /tmp/order-package && zip -qr "$GITHUB_WORKSPACE/order.zip" .)

      - name: Package Authorizer Lambda
        run: |
          set -euo pipefail
          rm -rf /tmp/authorizer-package authorizer.zip
          mkdir -p /tmp/authorizer-package
          python3 -m pip install PyMySQL -t /tmp/authorizer-package --no-compile
          cp lambda/authorizer/lambda_function.py /tmp/authorizer-package/
          (cd /tmp/authorizer-package && zip -qr "$GITHUB_WORKSPACE/authorizer.zip" .)

      - name: Package Report Lambda
        run: |
          set -euo pipefail
          rm -rf /tmp/report-package report.zip
          mkdir -p /tmp/report-package
          python3 -m pip install PyMySQL -t /tmp/report-package --no-compile
          cp lambda/report/lambda_function.py /tmp/report-package/
          (cd /tmp/report-package && zip -qr "$GITHUB_WORKSPACE/report.zip" .)

      - name: Package Schema Runner Lambda
        run: |
          set -euo pipefail
          rm -rf /tmp/schema-package schema-runner.zip
          mkdir -p /tmp/schema-package
          python3 -m pip install PyMySQL -t /tmp/schema-package --no-compile
          cp lambda/schema-runner/lambda_function.py /tmp/schema-package/
          cp database/schema.sql /tmp/schema-package/
          (cd /tmp/schema-package && zip -qr "$GITHUB_WORKSPACE/schema-runner.zip" .)

      - name: Upload Lambda artifacts
        run: |
          set -euo pipefail

          aws s3 cp product.zip \
            "s3://${LAMBDA_BUCKET}/product/product-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp inventory-alert.zip \
            "s3://${LAMBDA_BUCKET}/inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp order.zip \
            "s3://${LAMBDA_BUCKET}/order/order-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp authorizer.zip \
            "s3://${LAMBDA_BUCKET}/authorizer/authorizer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp report.zip \
            "s3://${LAMBDA_BUCKET}/report/report-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp schema-runner.zip \
            "s3://${LAMBDA_BUCKET}/schema/schema-runner-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Upload dashboard files
        run: |
          set -euo pipefail

          aws s3 cp dashboard/app.py \
            "s3://${REPORTS_BUCKET}/${DASHBOARD_S3_PREFIX}/app.py" \
            --region "$AWS_REGION"

          aws s3 cp dashboard/index.html \
            "s3://${REPORTS_BUCKET}/${DASHBOARD_S3_PREFIX}/index.html" \
            --region "$AWS_REGION"

      - name: Verify uploaded artifacts
        run: |
          set -euo pipefail

          for key in \
            "product/product-${GITHUB_SHA}.zip" \
            "inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
            "order/order-${GITHUB_SHA}.zip" \
            "authorizer/authorizer-${GITHUB_SHA}.zip" \
            "report/report-${GITHUB_SHA}.zip" \
            "schema/schema-runner-${GITHUB_SHA}.zip"
          do
            echo "Checking s3://${LAMBDA_BUCKET}/${key}"
            aws s3api head-object \
              --bucket "$LAMBDA_BUCKET" \
              --key "$key" \
              --region "$AWS_REGION"
          done

          aws s3api head-object \
            --bucket "$REPORTS_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/app.py" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$REPORTS_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/index.html" \
            --region "$AWS_REGION"

          echo "All deployment artifacts verified."


  # =========================================================
  # 6. SCHEMA
  # =========================================================
  schema:
    name: 6 - Schema
    needs: artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Schema stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$SCHEMA_STACK" \
            --template-file cloudformation/schema-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaS3Key="schema/schema-runner-${GITHUB_SHA}.zip" \
              LambdaFunctionName="CloudMart-${ENVIRONMENT}-SchemaRunner" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Schema stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$SCHEMA_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Schema status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "ERROR: Schema stack is not ready."
              exit 1
              ;;
          esac

      - name: Verify Schema Runner Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-SchemaRunner" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table

      - name: Apply database schema
        run: |
          set -euo pipefail

          aws lambda invoke \
            --function-name "CloudMart-${ENVIRONMENT}-SchemaRunner" \
            --invocation-type RequestResponse \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            schema-response.json \
            --region "$AWS_REGION"

          echo "Schema Runner response:"
          cat schema-response.json

          grep -q '"statusCode": 200' schema-response.json
          echo "Database schema applied successfully."


  # =========================================================
  # 7. AUTH
  # =========================================================
  auth:
    name: 7 - Auth
    needs: schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Auth stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$AUTH_STACK" \
            --template-file cloudformation/Auth-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DbHostParameterName="/cloudmart/$ENVIRONMENT/db/host" \
              DbPortParameterName="/cloudmart/$ENVIRONMENT/db/port" \
              DbNameParameterName="/cloudmart/$ENVIRONMENT/db/name" \
              DbUsernameParameterName="/cloudmart/$ENVIRONMENT/db/username" \
              DbPasswordParameterName="/cloudmart/$ENVIRONMENT/db/password" \
              LambdaS3Key="authorizer/authorizer-${GITHUB_SHA}.zip" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Auth stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$AUTH_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Auth status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "ERROR: Auth stack is not ready."
              exit 1
              ;;
          esac

      - name: Verify Authorizer Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-Authorizer" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table


  # =========================================================
  # 8. API
  # =========================================================
  # api-stack.yaml owns API Gateway, Product Lambda, Order Lambda,
  # Inventory Alert Lambda, EventBridge and SNS resources.
  # =========================================================
  api:
    name: 8 - API
    needs: auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$API_STACK" \
            --template-file cloudformation/api-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaS3Key="product/product-${GITHUB_SHA}.zip" \
              InventoryAlertLambdaS3Key="inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
              LowStockEmail="/cloudmart/$ENVIRONMENT/notifications/low-stock-email" \
              OrderLambdaS3Key="order/order-${GITHUB_SHA}.zip" \
              OrderEmail="/cloudmart/$ENVIRONMENT/notifications/order-email" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify API stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$API_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "API status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "ERROR: API stack is not ready."
              exit 1
              ;;
          esac

      - name: Verify Product Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-ProductLambda" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table

      - name: Verify Order Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-OrderLambda" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table

      - name: Verify Inventory Alert Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-InventoryAlert" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table

      - name: Display API outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # =========================================================
  # 9. REPORTING
  # =========================================================
  reporting:
    name: 9 - Reporting
    needs: api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Reporting inputs from Data stack
        id: data_outputs
        run: |
          set -euo pipefail

          LAMBDA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_BUCKET" ] || [ "$LAMBDA_BUCKET" = "None" ]; then
            echo "ERROR: LambdaBucket output not found."
            exit 1
          fi

          if [ -z "$REPORTS_BUCKET" ] || [ "$REPORTS_BUCKET" = "None" ]; then
            echo "ERROR: ReportsBucketName output not found."
            exit 1
          fi

          echo "lambda_bucket=$LAMBDA_BUCKET" >> "$GITHUB_OUTPUT"
          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Deploy Reporting stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$REPORTING_STACK" \
            --template-file cloudformation/Reporting-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaS3Bucket="${{ steps.data_outputs.outputs.lambda_bucket }}" \
              LambdaS3Key="report/report-${GITHUB_SHA}.zip" \
              ReportsBucketName="${{ steps.data_outputs.outputs.reports_bucket }}" \
              DashboardS3Bucket="${{ steps.data_outputs.outputs.reports_bucket }}" \
              DashboardS3Prefix="$DASHBOARD_S3_PREFIX" \
              DbHostParameterName="/cloudmart/$ENVIRONMENT/db/host" \
              DbPortParameterName="/cloudmart/$ENVIRONMENT/db/port" \
              DbNameParameterName="/cloudmart/$ENVIRONMENT/db/name" \
              DbUsernameParameterName="/cloudmart/$ENVIRONMENT/db/username" \
              DbPasswordParameterName="/cloudmart/$ENVIRONMENT/db/password" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Reporting stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$REPORTING_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Reporting status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *)
              echo "ERROR: Reporting stack is not ready."
              exit 1
              ;;
          esac

      - name: Verify Report Generator Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-ReportGenerator" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
            --output table

      - name: Display Reporting outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$REPORTING_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # =========================================================
  # 10. MONITORING
  # =========================================================
  monitoring:
    name: 10 - Monitoring
    needs: reporting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read existing Monitoring Email parameter
        run: |
          set -euo pipefail

          MONITORING_EMAIL=$(aws ssm get-parameter \
            --name "/cloudmart/$ENVIRONMENT/monitoring/email" \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text)

          if [ -z "$MONITORING_EMAIL" ] || [ "$MONITORING_EMAIL" = "None" ]; then
            echo "ERROR: /cloudmart/$ENVIRONMENT/monitoring/email does not exist or is empty."
            echo "The monitoring email must be configured once in SSM before deployment."
            exit 1
          fi

          echo "Monitoring email parameter found. Reusing the stored value."
          echo "MONITORING_EMAIL=$MONITORING_EMAIL" >> "$GITHUB_ENV"

      - name: Deploy Monitoring stack
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --stack-name "$MONITORING_STACK" \
            --template-file cloudformation/monitoring-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              NotificationEmail="$MONITORING_EMAIL" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"


  # =========================================================
  # 11. FINAL VERIFICATION
  # =========================================================
  # No API/dashboard health tests are performed here.
  # This stage checks stack/resource existence and configuration.
  # Notification emails are persisted in SSM and reused across deployments.
  # =========================================================
  verify:
    name: 11 - Final Verification
    needs: monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify all CloudFormation stacks
        run: |
          set -euo pipefail

          for stack in \
            "$NETWORK_STACK" \
            "$DATA_STACK" \
            "$SECURITY_STACK" \
            "$SCHEMA_STACK" \
            "$AUTH_STACK" \
            "$API_STACK" \
            "$REPORTING_STACK" \
            "$MONITORING_STACK"
          do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$stack" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text)

            echo "$stack -> $STATUS"

            case "$STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE) ;;
              *)
                echo "ERROR: $stack is not complete."
                exit 1
                ;;
            esac
          done

      - name: Verify all six Lambda functions
        run: |
          set -euo pipefail

          for function_name in \
            "CloudMart-${ENVIRONMENT}-ProductLambda" \
            "CloudMart-${ENVIRONMENT}-OrderLambda" \
            "CloudMart-${ENVIRONMENT}-InventoryAlert" \
            "CloudMart-${ENVIRONMENT}-Authorizer" \
            "CloudMart-${ENVIRONMENT}-ReportGenerator" \
            "CloudMart-${ENVIRONMENT}-SchemaRunner"
          do
            echo "========================================"
            echo "Checking $function_name"
            echo "========================================"

            aws lambda get-function \
              --function-name "$function_name" \
              --region "$AWS_REGION" \
              --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler,State:State}' \
              --output table
          done

      - name: Verify SSM parameters
        run: |
          set -euo pipefail

          for name in \
            "/cloudmart/$ENVIRONMENT/db/password" \
            "/cloudmart/$ENVIRONMENT/db/host" \
            "/cloudmart/$ENVIRONMENT/db/port" \
            "/cloudmart/$ENVIRONMENT/db/name" \
            "/cloudmart/$ENVIRONMENT/db/username" \
            "/cloudmart/$ENVIRONMENT/notifications/order-email" \
            "/cloudmart/$ENVIRONMENT/notifications/low-stock-email" \
            "/cloudmart/$ENVIRONMENT/monitoring/email"
          do
            echo "Checking $name"
            aws ssm get-parameter \
              --name "$name" \
              --region "$AWS_REGION" \
              --query 'Parameter.{Name:Name,Type:Type}' \
              --output table
          done

      - name: Verify Lambda artifacts in S3
        run: |
          set -euo pipefail

          LAMBDA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          for key in \
            "product/product-${GITHUB_SHA}.zip" \
            "inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
            "order/order-${GITHUB_SHA}.zip" \
            "authorizer/authorizer-${GITHUB_SHA}.zip" \
            "report/report-${GITHUB_SHA}.zip" \
            "schema/schema-runner-${GITHUB_SHA}.zip"
          do
            aws s3api head-object \
              --bucket "$LAMBDA_BUCKET" \
              --key "$key" \
              --region "$AWS_REGION"
          done

          aws s3api head-object \
            --bucket "$REPORTS_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/app.py" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$REPORTS_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/index.html" \
            --region "$AWS_REGION"

          echo "All S3 artifacts verified."

      - name: Verify EventBridge rules
        run: |
          set -euo pipefail

          aws events describe-rule \
            --name "CloudMart-${ENVIRONMENT}-DailyReport" \
            --region "$AWS_REGION" \
            --query '{Name:Name,State:State,ScheduleExpression:ScheduleExpression}' \
            --output table

          aws events describe-rule \
            --name "CloudMart-${ENVIRONMENT}-InventoryChangedRule" \
            --event-bus-name "CloudMart-${ENVIRONMENT}-EventBus" \
            --region "$AWS_REGION" \
            --query '{Name:Name,State:State,EventBusName:EventBusName}' \
            --output table

      - name: Verify CloudWatch dashboard
        run: |
          aws cloudwatch get-dashboard \
            --dashboard-name "cloudmart-operations" \
            --region "$AWS_REGION" \
            --query '{DashboardName:DashboardName}' \
            --output table

      - name: Display final stack outputs
        run: |
          for stack in \
            "$API_STACK" \
            "$REPORTING_STACK" \
            "$MONITORING_STACK"
          do
            echo "========================================"
            echo "$stack"
            echo "========================================"

            aws cloudformation describe-stacks \
              --stack-name "$stack" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].Outputs' \
              --output table
          done

      - name: Deployment completed
        run: |
          echo "========================================"
          echo "CLOUDMART DEPLOYMENT COMPLETED"
          echo "========================================"
          echo "Network -> SSM -> Data -> Security -> Artifacts -> Schema -> Auth -> API -> Reporting -> Monitoring -> Final Verification"
          echo "No API/dashboard smoke tests were executed."
