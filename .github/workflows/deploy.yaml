name: Deploy CloudMart - Full Stack

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

  NETWORK_STACK: cloudmart-dev-network
  DATA_STACK: cloudmart-dev-data
  SECURITY_STACK: cloudmart-dev-security
  SCHEMA_STACK: cloudmart-dev-schema
  AUTH_STACK: cloudmart-dev-auth
  API_STACK: cloudmart-dev-api
  REPORTING_STACK: cloudmart-dev-reporting
  MONITORING_STACK: cloudmart-dev-monitoring

  DASHBOARD_S3_PREFIX: cloudmart-dashboard

  DB_NAME: cloudmart
  DB_USERNAME: cloudmartadmin

jobs:

  # =========================================================
  # 1. NETWORK
  # =========================================================
  network:
    name: 1 - Network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate CloudFormation templates
        run: |
          set -e
          for template in \
            cloudformation/Network-stack.yaml \
            cloudformation/Data-stack.yaml \
            cloudformation/Security-stack.yaml \
            cloudformation/schema-stack.yaml \
            cloudformation/Auth-stack.yaml \
            cloudformation/api-stack.yaml \
            cloudformation/Reporting-stack.yaml \
            cloudformation/monitoring-stack.yaml
          do
            echo "========================================"
            echo "Validating $template"
            echo "========================================"
            aws cloudformation validate-template \
              --template-body "file://$template" \
              --region "$AWS_REGION" >/dev/null
            echo "$template is valid."
          done

      - name: Deploy Network stack
        run: |
          aws cloudformation deploy \
            --stack-name "$NETWORK_STACK" \
            --template-file cloudformation/Network-stack.yaml \
            --parameter-overrides Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Network stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Network status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Network stack is not ready."; exit 1 ;;
          esac


  # =========================================================
  # 2. SSM - PRE-DATA PARAMETERS ONLY
  # =========================================================
  #
  # IMPORTANT:
  # The Data stack creates these RDS-derived parameters itself:
  #   /cloudmart/dev/db/host
  #   /cloudmart/dev/db/port
  #   /cloudmart/dev/db/name
  #   /cloudmart/dev/db/username
  #
  # Therefore this job creates only parameters that must exist
  # before Data is deployed.
  #
  # The current Authorizer authenticates against token_hash in
  # the users table, so there are NO user-token/admin-token SSM
  # parameters in this current implementation.
  # =========================================================
  ssm:
    name: 2 - SSM
    needs: network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required GitHub secrets
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
          ORDER_EMAIL: ${{ secrets.ORDER_EMAIL }}
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$ORDER_EMAIL" ]; then
            echo "ERROR: ORDER_EMAIL secret is missing."
            exit 1
          fi

          if [ -z "$LOW_STOCK_EMAIL" ]; then
            echo "ERROR: LOW_STOCK_EMAIL secret is missing."
            exit 1
          fi

          echo "Required pre-Data configuration is available."

      - name: Create or update DB password SecureString
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/password" \
            --type SecureString \
            --value "$DB_PASSWORD" \
            --overwrite \
            --region "$AWS_REGION"

          echo "DB password SecureString created/updated."

      - name: Create or update Order email parameter
        env:
          ORDER_EMAIL: ${{ secrets.ORDER_EMAIL }}
        run: |
          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/notifications/order-email" \
            --type String \
            --value "$ORDER_EMAIL" \
            --overwrite \
            --region "$AWS_REGION"

          echo "Order email parameter created/updated."

      - name: Create or update Low Stock email parameter
        env:
          LOW_STOCK_EMAIL: ${{ secrets.LOW_STOCK_EMAIL }}
        run: |
          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/notifications/low-stock-email" \
            --type String \
            --value "$LOW_STOCK_EMAIL" \
            --overwrite \
            --region "$AWS_REGION"

          echo "Low-stock email parameter created/updated."

      - name: Verify pre-Data SSM parameters
        run: |
          set -e

          for parameter in \
            "/cloudmart/${ENVIRONMENT}/db/password" \
            "/cloudmart/${ENVIRONMENT}/notifications/order-email" \
            "/cloudmart/${ENVIRONMENT}/notifications/low-stock-email"
          do
            echo "Checking $parameter"
            aws ssm get-parameter \
              --name "$parameter" \
              --region "$AWS_REGION" \
              --query 'Parameter.{Name:Name,Type:Type}' \
              --output table
          done


  # =========================================================
  # 3. DATA
  # =========================================================
  data:
    name: 3 - Data
    needs: ssm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify DB password parameter exists
        run: |
          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/db/password" \
            --region "$AWS_REGION" \
            --query 'Parameter.{Name:Name,Type:Type}' \
            --output table

      - name: Deploy Data stack
        run: |
          aws cloudformation deploy \
            --stack-name "$DATA_STACK" \
            --template-file cloudformation/Data-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="$DB_NAME" \
              DBUsername="$DB_USERNAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Data stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Data status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Data stack is not ready."; exit 1 ;;
          esac

      - name: Verify RDS-derived SSM parameters created by Data
        run: |
          set -e

          for parameter in \
            "/cloudmart/${ENVIRONMENT}/db/host" \
            "/cloudmart/${ENVIRONMENT}/db/port" \
            "/cloudmart/${ENVIRONMENT}/db/name" \
            "/cloudmart/${ENVIRONMENT}/db/username"
          do
            echo "Checking $parameter"
            aws ssm get-parameter \
              --name "$parameter" \
              --region "$AWS_REGION" \
              --query 'Parameter.{Name:Name,Type:Type}' \
              --output table
          done

      - name: Display Data stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # =========================================================
  # 4. SECURITY
  # =========================================================
  security:
    name: 4 - Security
    needs: data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Reports bucket from Data stack
        run: |
          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          if [ -z "$REPORTS_BUCKET" ] || [ "$REPORTS_BUCKET" = "None" ]; then
            echo "ERROR: ReportsBucketName output not found."
            exit 1
          fi

          echo "REPORTS_BUCKET=$REPORTS_BUCKET" >> "$GITHUB_ENV"
          echo "Reports bucket found."

      - name: Deploy Security stack
        run: |
          aws cloudformation deploy \
            --stack-name "$SECURITY_STACK" \
            --template-file cloudformation/Security-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DashboardS3Bucket="$REPORTS_BUCKET" \
              DashboardS3Prefix="$DASHBOARD_S3_PREFIX" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Security stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$SECURITY_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Security status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Security stack is not ready."; exit 1 ;;
          esac


  # =========================================================
  # 5. ARTIFACTS
  # =========================================================
  # Packages and uploads Lambda code + dashboard files.
  # This is NOT a CloudFormation stack.
  # =========================================================
  artifacts:
    name: 5 - Artifacts
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get S3 buckets from Data stack
        run: |
          LAMBDA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          if [ -z "$LAMBDA_BUCKET" ] || [ "$LAMBDA_BUCKET" = "None" ]; then
            echo "ERROR: Lambda bucket not found."
            exit 1
          fi

          if [ -z "$REPORTS_BUCKET" ] || [ "$REPORTS_BUCKET" = "None" ]; then
            echo "ERROR: Reports bucket not found."
            exit 1
          fi

          echo "LAMBDA_BUCKET=$LAMBDA_BUCKET" >> "$GITHUB_ENV"
          echo "REPORTS_BUCKET=$REPORTS_BUCKET" >> "$GITHUB_ENV"

      - name: Verify source files
        run: |
          set -e
          test -s lambda/product/lambda_function.py
          test -s lambda/inventory-alert/lambda_function.py
          test -s lambda/order/lambda_function.py
          test -s lambda/authorizer/lambda_function.py
          test -s lambda/report/lambda_function.py
          test -s lambda/schema-runner/lambda_function.py
          test -s database/schema.sql
          test -s dashboard/app.py
          test -s dashboard/index.html
          echo "All Lambda and dashboard source files are present."

      - name: Build Product Lambda package
        run: |
          rm -rf build-product product.zip
          mkdir build-product
          python -m pip install PyMySQL --target build-product
          cp lambda/product/lambda_function.py build-product/
          cd build-product
          zip -qr ../product.zip .
          cd ..

      - name: Build Inventory Alert Lambda package
        run: |
          rm -rf build-inventory-alert inventory-alert.zip
          mkdir build-inventory-alert
          cp lambda/inventory-alert/lambda_function.py build-inventory-alert/
          cd build-inventory-alert
          zip -qr ../inventory-alert.zip .
          cd ..

      - name: Build Order Lambda package
        run: |
          rm -rf build-order order.zip
          mkdir build-order
          python -m pip install PyMySQL --target build-order
          cp lambda/order/lambda_function.py build-order/
          cd build-order
          zip -qr ../order.zip .
          cd ..

      - name: Build Authorizer Lambda package
        run: |
          rm -rf build-authorizer authorizer.zip
          mkdir build-authorizer
          python -m pip install PyMySQL --target build-authorizer
          cp lambda/authorizer/lambda_function.py build-authorizer/
          cd build-authorizer
          zip -qr ../authorizer.zip .
          cd ..

      - name: Build Report Lambda package
        run: |
          rm -rf build-report report.zip
          mkdir build-report
          python -m pip install PyMySQL --target build-report
          cp lambda/report/lambda_function.py build-report/
          cd build-report
          zip -qr ../report.zip .
          cd ..

      - name: Build Schema Runner Lambda package
        run: |
          rm -rf build-schema schema-runner.zip
          mkdir build-schema
          python -m pip install PyMySQL --target build-schema
          cp lambda/schema-runner/lambda_function.py build-schema/
          cp database/schema.sql build-schema/
          cd build-schema
          zip -qr ../schema-runner.zip .
          cd ..

      - name: Upload Lambda packages
        run: |
          set -e

          aws s3 cp product.zip \
            "s3://${LAMBDA_BUCKET}/product/product-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp inventory-alert.zip \
            "s3://${LAMBDA_BUCKET}/inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp order.zip \
            "s3://${LAMBDA_BUCKET}/order/order-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp authorizer.zip \
            "s3://${LAMBDA_BUCKET}/authorizer/authorizer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp report.zip \
            "s3://${LAMBDA_BUCKET}/report/report-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3 cp schema-runner.zip \
            "s3://${LAMBDA_BUCKET}/schema/schema-runner-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

      - name: Upload dashboard files
        run: |
          aws s3 cp dashboard/app.py \
            "s3://${REPORTS_BUCKET}/${DASHBOARD_S3_PREFIX}/app.py" \
            --region "$AWS_REGION"

          aws s3 cp dashboard/index.html \
            "s3://${REPORTS_BUCKET}/${DASHBOARD_S3_PREFIX}/index.html" \
            --region "$AWS_REGION"

      - name: Verify uploaded artifacts
        run: |
          set -e

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "product/product-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "order/order-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "authorizer/authorizer-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "report/report-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$LAMBDA_BUCKET" \
            --key "schema/schema-runner-${GITHUB_SHA}.zip" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$REPORTS_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/app.py" \
            --region "$AWS_REGION"

          aws s3api head-object \
            --bucket "$REPORTS_BUCKET" \
            --key "${DASHBOARD_S3_PREFIX}/index.html" \
            --region "$AWS_REGION"

          echo "All deployment artifacts verified."


  # =========================================================
  # 6. SCHEMA
  # =========================================================
  schema:
    name: 6 - Schema
    needs: artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lambda bucket
        run: |
          LAMBDA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          echo "LAMBDA_BUCKET=$LAMBDA_BUCKET" >> "$GITHUB_ENV"

      - name: Deploy Schema stack
        run: |
          aws cloudformation deploy \
            --stack-name "$SCHEMA_STACK" \
            --template-file cloudformation/schema-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaS3Key="schema/schema-runner-${GITHUB_SHA}.zip" \
              LambdaFunctionName="CloudMart-${ENVIRONMENT}-SchemaRunner" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Schema stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$SCHEMA_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Schema status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Schema stack is not ready."; exit 1 ;;
          esac

      - name: Verify Schema Runner Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-SchemaRunner" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler}' \
            --output table


  # =========================================================
  # 7. AUTH
  # =========================================================
  auth:
    name: 7 - Auth
    needs: schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Auth stack
        run: |
          aws cloudformation deploy \
            --stack-name "$AUTH_STACK" \
            --template-file cloudformation/Auth-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DbHostParameterName="/cloudmart/${ENVIRONMENT}/db/host" \
              DbPortParameterName="/cloudmart/${ENVIRONMENT}/db/port" \
              DbNameParameterName="/cloudmart/${ENVIRONMENT}/db/name" \
              DbUsernameParameterName="/cloudmart/${ENVIRONMENT}/db/username" \
              DbPasswordParameterName="/cloudmart/${ENVIRONMENT}/db/password" \
              LambdaS3Key="authorizer/authorizer-${GITHUB_SHA}.zip" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Auth stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$AUTH_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Auth status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Auth stack is not ready."; exit 1 ;;
          esac

      - name: Verify Authorizer Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-Authorizer" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler}' \
            --output table


  # =========================================================
  # 8. API
  # =========================================================
  api:
    name: 8 - API
    needs: auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API stack
        run: |
          aws cloudformation deploy \
            --stack-name "$API_STACK" \
            --template-file cloudformation/api-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaS3Key="product/product-${GITHUB_SHA}.zip" \
              InventoryAlertLambdaS3Key="inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
              OrderLambdaS3Key="order/order-${GITHUB_SHA}.zip" \
              LowStockEmail="/cloudmart/${ENVIRONMENT}/notifications/low-stock-email" \
              OrderEmail="/cloudmart/${ENVIRONMENT}/notifications/order-email" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify API stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$API_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "API status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "API stack is not ready."; exit 1 ;;
          esac

      - name: Display API outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$API_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

      - name: Verify Product Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-ProductLambda" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler}' \
            --output table

      - name: Verify Order Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-OrderLambda" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler}' \
            --output table

      - name: Verify Inventory Alert Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-InventoryAlert" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler}' \
            --output table


  # =========================================================
  # 9. REPORTING
  # =========================================================
  reporting:
    name: 9 - Reporting
    needs: api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get bucket names from Data stack
        run: |
          LAMBDA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          echo "LAMBDA_BUCKET=$LAMBDA_BUCKET" >> "$GITHUB_ENV"
          echo "REPORTS_BUCKET=$REPORTS_BUCKET" >> "$GITHUB_ENV"

      - name: Deploy Reporting stack
        run: |
          aws cloudformation deploy \
            --stack-name "$REPORTING_STACK" \
            --template-file cloudformation/Reporting-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              LambdaS3Bucket="$LAMBDA_BUCKET" \
              LambdaS3Key="report/report-${GITHUB_SHA}.zip" \
              ReportsBucketName="$REPORTS_BUCKET" \
              DashboardS3Bucket="$REPORTS_BUCKET" \
              DashboardS3Prefix="$DASHBOARD_S3_PREFIX" \
              DbHostParameterName="/cloudmart/${ENVIRONMENT}/db/host" \
              DbPortParameterName="/cloudmart/${ENVIRONMENT}/db/port" \
              DbNameParameterName="/cloudmart/${ENVIRONMENT}/db/name" \
              DbUsernameParameterName="/cloudmart/${ENVIRONMENT}/db/username" \
              DbPasswordParameterName="/cloudmart/${ENVIRONMENT}/db/password" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Reporting stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$REPORTING_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Reporting status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Reporting stack is not ready."; exit 1 ;;
          esac

      - name: Verify Report Generator Lambda
        run: |
          aws lambda get-function \
            --function-name "CloudMart-${ENVIRONMENT}-ReportGenerator" \
            --region "$AWS_REGION" \
            --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler}' \
            --output table

      - name: Display Reporting outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$REPORTING_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # =========================================================
  # 10. MONITORING
  # =========================================================
  monitoring:
    name: 10 - Monitoring
    needs: reporting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate monitoring email secret
        env:
          MONITORING_EMAIL: ${{ secrets.MONITORING_EMAIL }}
        run: |
          if [ -z "$MONITORING_EMAIL" ]; then
            echo "ERROR: MONITORING_EMAIL secret is missing."
            exit 1
          fi
          echo "Monitoring email is configured."

      - name: Deploy Monitoring stack
        env:
          MONITORING_EMAIL: ${{ secrets.MONITORING_EMAIL }}
        run: |
          aws cloudformation deploy \
            --stack-name "$MONITORING_STACK" \
            --template-file cloudformation/monitoring-stack.yaml \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              NotificationEmail="$MONITORING_EMAIL" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Verify Monitoring stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$MONITORING_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo "Monitoring status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Monitoring stack is not ready."; exit 1 ;;
          esac

      - name: Display Monitoring outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$MONITORING_STACK" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table


  # =========================================================
  # 11. FINAL VERIFICATION
  # =========================================================
  # No API/dashboard smoke tests are performed here.
  # This stage verifies resource existence and stack outputs.
  # =========================================================
  verify:
    name: 11 - Final Verification
    needs: monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify all CloudFormation stacks
        run: |
          set -e

          for stack in \
            "$NETWORK_STACK" \
            "$DATA_STACK" \
            "$SECURITY_STACK" \
            "$SCHEMA_STACK" \
            "$AUTH_STACK" \
            "$API_STACK" \
            "$REPORTING_STACK" \
            "$MONITORING_STACK"
          do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$stack" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text)

            echo "$stack -> $STATUS"

            case "$STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE) ;;
              *) echo "ERROR: $stack is not complete."; exit 1 ;;
            esac
          done

      - name: Verify all six Lambda functions
        run: |
          set -e

          for function_name in \
            "CloudMart-${ENVIRONMENT}-ProductLambda" \
            "CloudMart-${ENVIRONMENT}-OrderLambda" \
            "CloudMart-${ENVIRONMENT}-InventoryAlert" \
            "CloudMart-${ENVIRONMENT}-Authorizer" \
            "CloudMart-${ENVIRONMENT}-ReportGenerator" \
            "CloudMart-${ENVIRONMENT}-SchemaRunner"
          do
            echo "Checking $function_name"
            aws lambda get-function \
              --function-name "$function_name" \
              --region "$AWS_REGION" \
              --query 'Configuration.{Name:FunctionName,Runtime:Runtime,Handler:Handler}' \
              --output table
          done

      - name: Verify important SSM parameters
        run: |
          set -e

          for parameter in \
            "/cloudmart/${ENVIRONMENT}/db/password" \
            "/cloudmart/${ENVIRONMENT}/db/host" \
            "/cloudmart/${ENVIRONMENT}/db/port" \
            "/cloudmart/${ENVIRONMENT}/db/name" \
            "/cloudmart/${ENVIRONMENT}/db/username" \
            "/cloudmart/${ENVIRONMENT}/notifications/order-email" \
            "/cloudmart/${ENVIRONMENT}/notifications/low-stock-email" \
            "/cloudmart/${ENVIRONMENT}/monitoring/email"
          do
            aws ssm get-parameter \
              --name "$parameter" \
              --region "$AWS_REGION" \
              --query 'Parameter.{Name:Name,Type:Type}' \
              --output table
          done

      - name: Verify Lambda artifacts in S3
        run: |
          set -e

          LAMBDA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucketName'].OutputValue" \
            --output text)

          for key in \
            "product/product-${GITHUB_SHA}.zip" \
            "inventory-alert/inventory-alert-${GITHUB_SHA}.zip" \
            "order/order-${GITHUB_SHA}.zip" \
            "authorizer/authorizer-${GITHUB_SHA}.zip" \
            "report/report-${GITHUB_SHA}.zip" \
            "schema/schema-runner-${GITHUB_SHA}.zip"
          do
            echo "Checking s3://${LAMBDA_BUCKET}/${key}"
            aws s3api head-object \
              --bucket "$LAMBDA_BUCKET" \
              --key "$key" \
              --region "$AWS_REGION"
          done

          for key in \
            "${DASHBOARD_S3_PREFIX}/app.py" \
            "${DASHBOARD_S3_PREFIX}/index.html"
          do
            echo "Checking s3://${REPORTS_BUCKET}/${key}"
            aws s3api head-object \
              --bucket "$REPORTS_BUCKET" \
              --key "$key" \
              --region "$AWS_REGION"
          done

      - name: Verify EventBridge rules
        run: |
          aws events describe-rule \
            --name "CloudMart-${ENVIRONMENT}-DailyReport" \
            --region "$AWS_REGION" \
            --query '{Name:Name,State:State,ScheduleExpression:ScheduleExpression}' \
            --output table || true

          aws events describe-rule \
            --name "CloudMart-${ENVIRONMENT}-InventoryChangedRule" \
            --event-bus-name "CloudMart-${ENVIRONMENT}-EventBus" \
            --region "$AWS_REGION" \
            --query '{Name:Name,State:State,EventBusName:EventBusName}' \
            --output table || true

      - name: Verify Monitoring dashboard
        run: |
          aws cloudwatch get-dashboard \
            --dashboard-name "cloudmart-operations" \
            --region "$AWS_REGION" \
            --query '{DashboardName:DashboardName}' \
            --output table

      - name: Display final stack outputs
        run: |
          for stack in \
            "$API_STACK" \
            "$REPORTING_STACK" \
            "$MONITORING_STACK"
          do
            echo "========================================"
            echo "$stack"
            echo "========================================"
            aws cloudformation describe-stacks \
              --stack-name "$stack" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].Outputs' \
              --output table
          done

      - name: Deployment completed
        run: |
          echo "========================================"
          echo "CLOUDMART DEPLOYMENT COMPLETED"
          echo "========================================"
          echo "Flow:"
          echo "Network -> SSM -> Data -> Security -> Artifacts -> Schema -> Auth -> API -> Reporting -> Monitoring -> Final Verification"
          echo "No smoke tests were executed."
